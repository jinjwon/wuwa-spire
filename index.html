<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>명조: 첨탑의 메아리</title>
<style>
:root{
  --bg:#0b0f1d; --bg2:#121833; --panel:#161d3a; --panel2:#1d2650; --line:#2c3768;
  --text:#e8ecff; --dim:#98a2cf; --gold:#ffd75e; --red:#ff5d6c; --green:#5be3a1; --blue:#6fb6ff;
  --rov:#f3d36b; --aem:#ff8a5c; --sk:#b7a6ff; --any:#9fb3d9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#24306a 0%,var(--bg) 60%) fixed,var(--bg);color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:14px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:1200px;margin:0 auto;padding:12px 16px 12px;min-height:100vh;display:flex;flex-direction:column}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 16px;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--gold);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(180deg,#3b4aa0,#2a3578);border-color:#5d6fd0}
.btn.gold{background:linear-gradient(180deg,#8a6a1c,#5e4612);border-color:var(--gold)}
h1,h2,h3{margin:0}
.dim{color:var(--dim)}
/* top bar */
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:rgba(22,29,58,.85);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.top .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.echo{cursor:help;border-color:#3d5aa8}
/* title */
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:30px 0}
.title h1{font-size:40px;letter-spacing:2px;background:linear-gradient(90deg,var(--sk),var(--gold),var(--aem));-webkit-background-clip:text;background-clip:text;color:transparent}
.party-intro{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:1000px}
.pi.sel{cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.pi.sel:hover{border-color:var(--c);transform:translateY(-4px)}
.pi .kit{font-size:11px;color:var(--dim);padding-left:15px;margin:8px 0 0;line-height:1.5;flex:1}
.pi .pick{margin-top:10px;text-align:center;font-weight:800;color:var(--c);border:1px solid var(--c);border-radius:9px;padding:6px}
.pi{width:220px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.pi .av{width:84px;height:84px;border:2px solid #fff3;border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:800;color:#111;margin-bottom:8px}
.pi p{margin:6px 0 0;font-size:12px;line-height:1.5;color:var(--dim)}
.howto{max-width:640px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:13px;line-height:1.7;color:var(--dim)}
.howto b{color:var(--text)}
.titlescr{position:relative;flex:1;min-height:calc(100vh - 24px);border-radius:20px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;isolation:isolate;text-align:center;padding:40px 16px 56px}
.t-logo h1{font-size:clamp(46px,8vw,96px);letter-spacing:8px;margin:8px 0 4px;background:linear-gradient(90deg,#c9b8ff,#ffe9a8 50%,#ff9a7a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 26px rgba(255,215,140,.4));animation:tglow 4s ease-in-out infinite}
@keyframes tglow{50%{filter:drop-shadow(0 4px 40px rgba(200,180,255,.6))}}
.t-sub{letter-spacing:6px;font-size:12px;color:var(--dim)}
.t-en{font-family:Georgia,'Times New Roman',serif;font-style:italic;letter-spacing:4px;color:#cfd6ff;opacity:.85}
.t-party{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.t-party .tp{width:clamp(46px,6.5vw,72px);aspect-ratio:1;border-radius:50%;border:2px solid var(--c);background-color:#0c1126;box-shadow:0 0 20px -4px var(--c);animation:idle 3.2s ease-in-out infinite;display:grid;place-items:center;font-weight:800}
.t-menu{display:flex;flex-direction:column;gap:10px;width:min(330px,100%)}
.t-menu button{padding:13px 18px;border-radius:12px;font-size:17px;font-weight:800;background:rgba(22,29,58,.78);border:1px solid #4a5aa8;backdrop-filter:blur(4px);transition:.15s}
.t-menu button:hover{border-color:var(--gold);transform:translateX(4px)}
.t-menu button.main{background:linear-gradient(180deg,#8a6a1c,#5e4612);border-color:var(--gold)}
.t-menu small{display:block;font-size:11px;font-weight:400;color:#e8dcb8;margin-top:3px}
.t-foot{position:absolute;bottom:14px;left:16px;right:16px;font-size:11px;color:var(--dim)}
.backbtn{align-self:flex-start}
.vfx{position:fixed;pointer-events:none;z-index:65}
.vfx.slash{width:var(--s);height:var(--s);transform:translate(-50%,-50%) rotate(var(--r))}
.vfx.slash svg{width:100%;height:100%;overflow:visible;animation-delay:inherit}
.vfx.slash path{fill:none;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:slashdraw .34s cubic-bezier(.2,.7,.3,1) forwards;animation-delay:inherit;filter:drop-shadow(0 0 4px rgba(255,255,255,.6))}
@keyframes slashdraw{55%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-100;opacity:0}}
.vfx.spark{width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--c);animation:spark .5s ease-out forwards}
@keyframes spark{0%{transform:none;opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.vfx.ring{width:var(--s);height:var(--s);border:3px solid var(--c);border-radius:50%;transform:translate(-50%,-50%) scale(.2);animation:ring .45s ease-out forwards}
@keyframes ring{to{transform:translate(-50%,-50%) scale(1);opacity:0;border-width:1px}}
.vfx.tracer{height:3px;transform-origin:0 50%;transform:rotate(var(--a)) scaleX(0);background:linear-gradient(90deg,transparent,var(--c) 60%,#fff);border-radius:2px;animation:tracer .22s ease-out forwards}
@keyframes tracer{60%{transform:rotate(var(--a)) scaleX(1);opacity:1}100%{transform:rotate(var(--a)) scaleX(1);opacity:0}}
.vfx.star{font-size:46px;color:var(--c);transform:translate(-50%,-50%) scale(.3);animation:star .5s ease-out forwards}
@keyframes star{50%{transform:translate(-50%,-50%) scale(1.2) rotate(40deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.6) rotate(80deg);opacity:0}}
.vfx.shield{width:var(--s);height:var(--s);transform:translate(-50%,-50%) scale(.7);animation:shieldp .55s ease-out forwards}
.vfx.shield svg{width:100%;height:100%}
@keyframes shieldp{30%{transform:translate(-50%,-50%) scale(1.05);opacity:1}100%{transform:translate(-50%,-50%) scale(1.15);opacity:0}}
.vfx.magic{width:var(--s);transform:translate(-50%,-50%) scale(.5);animation:magic .75s ease-out forwards}
.vfx.magic svg{width:100%;display:block}
@keyframes magic{25%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1.15) rotate(8deg);opacity:0}}
.vfx.plus{font-size:20px;font-weight:900;color:var(--green);opacity:0;animation:plus .9s ease-out forwards}
@keyframes plus{15%{opacity:1}100%{transform:translateY(-50px);opacity:0}}
.cutin{position:fixed;left:0;right:0;top:30%;height:170px;z-index:70;pointer-events:none}
.cutin .band{position:absolute;inset:18px 0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 55%,#0b0f1d) 12%,color-mix(in srgb,var(--c) 40%,#0b0f1d) 88%,transparent);transform:skewY(-3deg) scaleX(0);transform-origin:0 50%;animation:cibar 1.2s ease forwards}
.cutin .img{position:absolute;left:10%;top:-20px;width:210px;height:210px;border-radius:50%;background:#0c1126 center 18%/130% no-repeat;border:3px solid var(--c);display:grid;place-items:center;font-size:60px;font-weight:900;color:#111;opacity:0;animation:ciimg 1.2s ease forwards}
.cutin .txt{position:absolute;left:calc(10% + 240px);top:58px;text-align:left;opacity:0;animation:citxt 1.2s ease forwards}
.cutin .txt small{display:block;font-size:13px;color:#e8ecff;letter-spacing:2px}
.cutin .txt b{font-size:clamp(24px,4vw,40px);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
@keyframes cibar{0%{transform:skewY(-3deg) scaleX(0)}14%{transform:skewY(-3deg) scaleX(1);opacity:1}78%{opacity:1}100%{transform:skewY(-3deg) scaleX(1);opacity:0}}
@keyframes ciimg{0%{transform:translateX(-140px);opacity:0}18%{transform:none;opacity:1}75%{transform:translateX(24px);opacity:1}100%{transform:translateX(140px);opacity:0}}
@keyframes citxt{0%{transform:translateX(120px);opacity:0}24%{transform:none;opacity:1}75%{opacity:1}100%{opacity:0}}
@media (max-width:640px){.cutin .img{width:120px;height:120px;top:20px;left:4%}.cutin .txt{left:calc(4% + 136px)}}
.box.pause{max-width:420px}
/* map */
.mapwrap{position:relative;margin:0 auto;width:min(560px,100%);}
.map{position:relative}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,50%);width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:12px;font-weight:700;line-height:1}
.node.avail{border-color:var(--gold);color:var(--gold)!important}
.node.done{opacity:.45}
.node.cur{border-color:#fff;background:#3b4aa0}
.node.boss{width:76px;height:76px;font-size:13px;border-color:var(--red)}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,215,94,.06)}}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 12px;font-size:12px}
/* ===== 전투 무대 ===== */
#screen{flex:1;display:flex;flex-direction:column}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#111;flex:none}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);white-space:nowrap}
.combat{flex:1;display:flex;flex-direction:column;min-height:calc(100vh - 100px)}
.stage{position:relative;flex:1;min-height:400px;border-radius:18px;overflow:hidden;border:1px solid var(--line);isolation:isolate;--pw:clamp(84px,13vw,150px)}
.stage.shake{animation:stshake .35s}
@keyframes stshake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.bgsvg{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.mote{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.0;z-index:-1;animation:mote 7s linear infinite}
@keyframes mote{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-220px);opacity:0}}
.stlog{position:absolute;left:12px;top:10px;font-size:12px;color:var(--dim);background:rgba(8,10,22,.55);padding:6px 10px;border-radius:10px;max-width:44%;line-height:1.5;z-index:20;pointer-events:none}
.stlog div:last-child{color:var(--text)}
.stlog:empty{display:none}
.tgthint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:20;background:rgba(40,30,0,.8);border:1px solid var(--gold);color:var(--gold);padding:6px 12px;border-radius:10px;font-size:13px}
.tgthint:empty{display:none}
.unit{position:absolute;width:var(--w,var(--pw));transform:translateX(-50%) scale(var(--sc,1));transform-origin:50% 100%;
  transition:left .5s cubic-bezier(.3,1.25,.5,1),bottom .5s cubic-bezier(.3,1.25,.5,1),transform .5s,filter .45s,opacity .6s;display:flex;flex-direction:column;align-items:center}
.unit .body{position:relative;width:100%}
.unit .fig{animation:idle 2.8s ease-in-out infinite;animation-delay:var(--dl,0s);position:relative;z-index:1}
@keyframes idle{50%{transform:translateY(-6px)}}
.unit .shadow{position:absolute;left:8%;right:8%;bottom:-10px;height:18px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.6),transparent 70%)}
.unit.party.s0{left:33%;bottom:21%;--sc:1;z-index:6}
.unit.party.s1{left:9%;bottom:50%;--sc:.6;z-index:3;filter:brightness(.55) saturate(.7)}
.unit.party.s2{left:17%;bottom:16%;--sc:.66;z-index:4;filter:brightness(.55) saturate(.7)}
.unit.party.swappable{cursor:pointer}
.unit.party.swappable:hover{filter:brightness(.95) saturate(1)}
.unit.party.down{filter:grayscale(1) brightness(.35)!important}
.unit.party.down .fig{animation:none;transform:rotate(-8deg) translateY(10px)}
.unit.enemy{--w:clamp(90px,12vw,140px);z-index:5}
.unit.enemy.elite{--w:clamp(110px,15vw,175px)}
.unit.enemy.boss{--w:clamp(160px,24vw,270px)}
.unit.enemy.tgtable{cursor:crosshair}
.unit.enemy.tgtable .fig{filter:drop-shadow(0 0 10px var(--gold)) drop-shadow(0 0 2px var(--gold))}
.unit.enemy.tgtable:hover{--sc:1.06}
.unit.enemy.dead{opacity:0;--sc:.8;pointer-events:none;filter:brightness(3) blur(2px)}
.stand{width:100%;aspect-ratio:4/5;border-radius:18px 18px 40% 40%/18px 18px 22% 22%;overflow:hidden;border:2px solid var(--c);background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 45%,#0c1126),#0c1126 75%);
  box-shadow:0 0 26px -6px var(--c),inset 0 -30px 40px -20px rgba(0,0,0,.8);position:relative}
.stand img{width:118%;margin-left:-9%;margin-top:4%;display:block}
.stand i{position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,color-mix(in srgb,var(--c) 35%,transparent));pointer-events:none}
.eimg{width:100%;aspect-ratio:1;position:relative}
.eimg::before{content:'';position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 45%,transparent),transparent 70%);z-index:-1}
.eimg img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c) 70%,transparent)) drop-shadow(0 8px 6px rgba(0,0,0,.55))}
.sprite{width:100%;aspect-ratio:1;overflow:hidden;position:relative}
.sprite img{display:block;height:100%;image-rendering:pixelated;animation-name:spr;animation-iteration-count:infinite}
@keyframes spr{to{transform:translateX(var(--spr-end))}}
@media(prefers-reduced-motion:reduce){.sprite img{animation:none!important}.unit .fig,.unit .body{animation:none!important}}
.ph{width:100%;display:block;filter:drop-shadow(0 0 12px var(--c))}
.uhud{width:calc(100% + 26px);max-width:200px;margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;z-index:2}
.unit.enemy.boss .uhud{max-width:280px}
.hpb{position:relative;width:100%;height:15px;background:#1c0b10;border:1px solid #000;border-radius:8px;overflow:visible;box-shadow:0 2px 4px rgba(0,0,0,.6)}
.hpb i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.hpb i.lag{background:#ffcf9a;transition:width .8s .3s}
.hpb i.cur{background:linear-gradient(#ff7b7b,#c0303d);transition:width .3s}
.unit.party .hpb i.cur{background:linear-gradient(#6af0ae,#1f9e64)}
.hpb span{position:relative;display:block;text-align:center;font-size:11px;font-weight:800;line-height:14px;text-shadow:0 1px 2px #000,0 0 3px #000}
.hpb.blocked{border-color:#7cc0ff;box-shadow:0 0 0 1px #7cc0ff,0 0 10px #3d7bd9}
.hpb .blk{position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:28px;height:30px;display:none;place-items:center;font-size:12px;font-weight:800;
  background:linear-gradient(#6aa8ff,#2a5fc0);clip-path:polygon(50% 0,100% 15%,92% 65%,50% 100%,8% 65%,0 15%);text-shadow:0 1px 2px #000}
.hpb.blocked .blk{display:grid}
.nametag{font-size:11px;color:var(--dim);white-space:nowrap;text-shadow:0 1px 2px #000}
.nametag b{color:var(--text)}
.sts{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.st{font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(10,14,31,.85);border:1px solid var(--line);white-space:nowrap}
.gauges{display:flex;gap:2px;align-items:center}
.gp{width:11px;height:5px;border-radius:3px;background:rgba(0,0,0,.6);border:1px solid #39446f}
.gp.on{background:var(--c);border-color:var(--c);box-shadow:0 0 5px var(--c)}
.gp.l{width:7px}.gp.l.on{background:#fff;border-color:#fff;box-shadow:0 0 6px #fff}
.gsep{width:5px}
.intentf{position:absolute;top:-34px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;font-weight:900;font-size:17px;white-space:nowrap;z-index:3;
  text-shadow:0 2px 3px #000,0 0 4px #000;animation:float 1.8s ease-in-out infinite;pointer-events:none}
.intentf svg{width:26px;height:26px;filter:drop-shadow(0 2px 2px #000)}
.intentf .in-atk{color:#ff6d7c}.intentf .in-def{color:#7cc0ff}.intentf .in-buf{color:#ffd75e}.intentf .in-deb{color:#c58cff}
@keyframes float{50%{transform:translateX(-50%) translateY(-5px)}}
.swaptag{position:absolute;top:-26px;left:50%;transform:translateX(-50%) scale(1.4);font-size:11px;white-space:nowrap;background:rgba(10,14,31,.9);border:1px solid var(--c);color:var(--c);padding:2px 8px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:4}
.unit.swappable:hover .swaptag{opacity:1}
.swaptag.ready{opacity:.9;border-color:var(--gold);color:var(--gold)}
.libwrap{position:absolute;top:-44px;left:50%;transform:translateX(-50%);z-index:8}
.libbtn{white-space:nowrap;padding:6px 14px;border-radius:999px;border:1px solid #fff;background:linear-gradient(90deg,#4a3c9c,#a24fa0);font-weight:800;font-size:13px}
/* 행동 연출 */
.body.atk{animation:lungeR .45s cubic-bezier(.2,.8,.3,1)}
.enemy .body.atk{animation:lungeL .45s cubic-bezier(.2,.8,.3,1)}
.enemy .body.jab{animation:jabL .22s}
@keyframes lungeR{0%{transform:none}30%{transform:translateX(26%) translateY(-4%) scale(1.06)}45%{transform:translateX(70%) scale(1.08)}100%{transform:none}}
@keyframes lungeL{0%{transform:none}30%{transform:translateX(-26%) translateY(-4%) scale(1.06)}45%{transform:translateX(-70%) scale(1.08)}100%{transform:none}}
@keyframes jabL{50%{transform:translateX(-30%)}}
.body.hit{animation:hitP .4s}
.enemy .body.hit{animation:hitE .4s}
@keyframes hitP{0%{filter:brightness(3) saturate(0)}25%{transform:translateX(-12%) rotate(-3deg)}60%{transform:translateX(4%)}100%{transform:none;filter:none}}
@keyframes hitE{0%{filter:brightness(3) saturate(0)}25%{transform:translateX(10%) rotate(3deg)}60%{transform:translateX(-3%)}100%{transform:none;filter:none}}
.body.cast{animation:cast .55s}
.enemy .body.cast{animation:castE .6s}
@keyframes cast{40%{transform:translateY(-10%) scale(1.05);filter:brightness(1.5) drop-shadow(0 0 18px var(--c))}}
@keyframes castE{40%{transform:scale(1.1);filter:brightness(1.4) drop-shadow(0 0 18px var(--c))}}
.body.ult{animation:ult .9s}
@keyframes ult{0%{transform:none}25%{transform:translateY(-18%) scale(1.15);filter:brightness(2) drop-shadow(0 0 30px #fff)}45%{transform:translateY(-18%) scale(1.15);filter:brightness(2) drop-shadow(0 0 30px #fff)}65%{transform:translateX(90%) scale(1.1)}100%{transform:none;filter:none}}
.body.block{animation:blockP .35s}
@keyframes blockP{40%{filter:drop-shadow(0 0 16px #6fb6ff) brightness(1.3);transform:translateX(-4%)}}
/* 하단 */
.bottom{position:relative;height:178px;margin-top:-62px;z-index:30;pointer-events:none}
.lhud,.rhud,.hand .card{pointer-events:auto}
.lhud,.rhud{z-index:90}
.lhud{position:absolute;left:6px;bottom:8px;display:flex;flex-direction:column;align-items:center;gap:10px}
.rhud{position:absolute;right:6px;bottom:8px;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.energy{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:21px;font-weight:900;color:#2a1c00;
  background:radial-gradient(circle at 40% 35%,#fff3c4,#f2b632 55%,#a86f0a);border:3px solid #fff3c4;box-shadow:0 0 22px rgba(255,200,80,.55);text-shadow:0 1px 0 #fff6}
.energy.zero{filter:grayscale(.8) brightness(.6);box-shadow:none}
.pile{width:56px;height:70px;border-radius:10px;border:2px solid #6f7fc9;background:linear-gradient(160deg,#2f3d86,#18204a);font-weight:900;font-size:16px;position:relative;box-shadow:3px 3px 0 #10163a,6px 6px 0 #0b0f28}
.pile small{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--dim);white-space:nowrap;font-weight:400}
.pile.disc{border-color:#a96f7f;background:linear-gradient(160deg,#6a2f45,#2a1424);box-shadow:-3px 3px 0 #2a1020,-6px 6px 0 #1a0a14}
.endturn{padding:13px 20px;border-radius:14px;font-weight:900;font-size:15px;background:linear-gradient(#41b0b4,#1f6a78);border:2px solid #aef6f2;transition:.15s}
.endturn:hover:not(:disabled){transform:scale(1.05)}
.endturn:disabled{filter:grayscale(1) brightness(.6);cursor:default}
.endturn.glow{background:linear-gradient(#4fc8cc,#26808f)}
.hand{position:absolute;left:96px;right:120px;bottom:0;top:0}
.hand .card{position:absolute;bottom:-26px;transform-origin:50% 130%;transition:transform .18s,left .25s,filter .2s}
.hand .card:hover:not(.off),.hand .card.sel{z-index:80!important;transform:translateX(-50%) translateY(-52px) rotate(0) scale(1.14)!important}
/* 카드 */
.card{width:150px;height:210px;flex:none;border-radius:13px;position:relative;cursor:pointer;background:linear-gradient(180deg,#26306a,#141a3a);border:2px solid var(--c);
  box-shadow:0 8px 18px rgba(0,0,0,.55);display:flex;flex-direction:column;padding:6px 7px 7px;text-align:center;user-select:none;transition:transform .15s}
.card.t-공격{background:linear-gradient(180deg,#4a2433,#1d1226)}
.card.t-파워{background:linear-gradient(180deg,#4a3d1c,#1f1a10)}
.card.t-저주{background:linear-gradient(180deg,#2a2a2a,#101010);--c:#666!important}
.cards .card:hover:not(.off){transform:translateY(-6px)}
.card.off{filter:grayscale(.55) brightness(.6);cursor:default}
.card .cost{position:absolute;top:-9px;left:-9px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;z-index:2;
  background:radial-gradient(circle at 40% 35%,#fff3c4,#e2a422 60%,#9a6408);color:#2a1c00;border:2px solid #fff3c4;box-shadow:0 2px 4px #000}
.card .cost.up{background:radial-gradient(circle at 40% 35%,#ffd6db,#ff5d6c 60%,#9a1f2c);border-color:#ffd0d5;color:#fff}
.card .nm{margin:2px -11px 0;padding:4px 6px;font-weight:800;font-size:12.5px;line-height:1.2;color:#14101e;border-radius:4px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 92%,#fff),var(--c));box-shadow:0 2px 3px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .nm.u{color:#0b4a24}
.card .art{height:76px;margin-top:6px;border-radius:8px 8px 3px 3px;background-color:#0c1126;background-repeat:no-repeat;border:1px solid rgba(255,255,255,.18);position:relative;overflow:hidden}
.card .art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.55))}
.card .art .sym{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:var(--c);opacity:.9;z-index:1}
.card .ty{font-size:10px;margin:-8px auto 0;position:relative;z-index:1;background:#0b0f1d;border:1px solid var(--c);padding:0 8px;border-radius:999px;width:max-content;color:var(--dim)}
.card .tx{font-size:11.5px;line-height:1.38;flex:1;display:grid;place-items:center;padding:3px 1px;color:#eef}
.card .ow{font-size:10px;color:var(--c);font-weight:700}
.card .wait{position:absolute;top:-9px;right:-6px;font-size:9.5px;background:#5a1d28;color:#ffc2c9;border:1px solid #ff8a96;border-radius:6px;padding:1px 5px;z-index:2}
.hand .card{touch-action:none}
.hand .card:not(.off){cursor:grab}
.hand .card.ghost{opacity:0!important;pointer-events:none}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
body.dragging .hand .card{pointer-events:none}
.dragcard{position:fixed!important;z-index:75;pointer-events:none;margin:0!important;transition:transform .1s;box-shadow:0 20px 44px rgba(0,0,0,.65)}
.dragcard.aim{transition:left .16s,top .16s,transform .16s;box-shadow:0 0 0 3px var(--gold),0 0 34px rgba(255,215,94,.6)}
.dragcard.armed{box-shadow:0 0 0 3px var(--gold),0 0 34px rgba(255,215,94,.7)}
.dragcard.back{transition:left .2s,top .2s,transform .2s,opacity .3s}
.card.nope{animation:nope .3s}
@keyframes nope{25%{margin-left:-8px}75%{margin-left:8px}}
#arrow{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:74;display:none;overflow:visible}
#arrow .ln{fill:none;stroke:#ffd75e;stroke-width:11;stroke-linecap:round;stroke-dasharray:1 17;animation:adash .45s linear infinite;filter:drop-shadow(0 0 6px #ffb800)}
#arrow #ah path{fill:#ffd75e}
#arrow.hot .ln{stroke:#ff5d6c;filter:drop-shadow(0 0 8px #ff2040)}
#arrow.hot #ah path{fill:#ff5d6c}
@keyframes adash{to{stroke-dashoffset:-18}}
.unit.enemy.aimed{--sc:1.07}
.unit.enemy.aimed .fig{filter:drop-shadow(0 0 14px #ff5d6c) drop-shadow(0 0 3px #fff)}
.flycard{position:fixed;z-index:70;pointer-events:none;transition:transform .32s cubic-bezier(.4,0,.6,1),opacity .32s;margin:0!important}
@media (max-width:640px){
  .card{width:112px;height:162px;padding:5px}
  .card .art{height:52px}.card .nm{font-size:11px}.card .tx{font-size:10px}
  .hand{left:70px;right:84px}.energy{width:56px;height:56px;font-size:17px}.pile{width:44px;height:56px}
  .endturn{padding:10px 12px;font-size:13px}.bottom{height:140px}.hand .card{bottom:-38px}
  .stage{min-height:360px}
}
/* generic panels */
.screen{flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:680px;width:100%}
.box p{line-height:1.7}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.choice{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.choice:hover:not(:disabled){border-color:var(--gold)}
.choice:disabled{opacity:.4;cursor:default}
.choice small{display:block;color:var(--dim);margin-top:3px}
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.shopitem{display:flex;flex-direction:column;align-items:center;gap:6px}
.price{font-size:12px;color:var(--gold)}
.modal{position:fixed;inset:0;background:rgba(5,7,15,.82);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 16px}
.modal .box{max-width:980px}
.echoicon{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:radial-gradient(circle,#3d5aa8,#1b2550);border:2px solid #8aa8ff;margin:0 auto}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.pop{position:absolute;font-weight:800;font-size:20px;text-shadow:0 2px 4px #000;animation:pop .9s ease-out forwards}
.pop.dmg{color:#ff6d7c}.pop.heal{color:var(--green)}.pop.blk{color:var(--blue)}.pop.info{color:var(--gold);font-size:15px}
@keyframes pop{0%{transform:translate(-50%,0) scale(.8);opacity:0}15%{opacity:1;transform:translate(-50%,-8px) scale(1.1)}100%{transform:translate(-50%,-46px);opacity:0}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:rgba(10,14,31,.92);border:1px solid var(--gold);border-radius:14px;padding:14px 26px;font-size:18px;font-weight:700;z-index:55;pointer-events:none;animation:ban 1.1s forwards}
@keyframes ban{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}

/* ===== v2: 전신 캐릭터 · 움직임 · 슬더스식 UI ===== */
.stage{--ph:clamp(170px,33vh,320px)}
.unit.party .sprite{width:var(--ph);margin-left:calc((100% - var(--ph))/2)}
.full{height:var(--ph);display:flex;justify-content:center;align-items:flex-end}
.full img{height:100%;width:auto;max-width:none;display:block;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.unit.party .uhud{margin-top:6px}
.unit .fig{transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes breathe{0%,100%{transform:scale(1,1) skewX(0)}50%{transform:scale(1.012,1.03) skewX(-.7deg)}}
.unit.enemy.fly .fig{animation:hover 2.6s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes hover{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-14px) rotate(1.5deg)}}
.unit.enemy.fly .shadow{animation:shadowfly 2.6s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes shadowfly{50%{transform:scale(.8);opacity:.6}}
.unit.enemy.minion{--w:clamp(70px,9vw,110px)}
.aura{position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,color-mix(in srgb,var(--c) 35%,transparent),transparent 65%);animation:aura 3s ease-in-out infinite}
.aura::after{content:'';position:absolute;inset:14%;border-radius:50%;border:2px dashed color-mix(in srgb,var(--c) 70%,transparent);animation:spin 14s linear infinite}
@keyframes aura{50%{transform:translate(-50%,-50%) scale(1.08);opacity:.75}}
@keyframes spin{to{transform:rotate(360deg)}}
.unit.enemy.elite .aura{width:125%;opacity:.7}
/* 행동 */
.body.atk{animation:atkR .58s cubic-bezier(.3,.6,.3,1)}
@keyframes atkR{0%{transform:none}22%{transform:translateX(-9%) scale(.95,1.04) rotate(-4deg)}46%{transform:translateX(78%) scale(1.08,.95) rotate(5deg)}62%{transform:translateX(70%) rotate(3deg)}100%{transform:none}}
.enemy .body.atk{animation:atkL .62s cubic-bezier(.3,.6,.3,1)}
@keyframes atkL{0%{transform:none;filter:none}30%{transform:translateX(12%) scale(1.08) rotate(5deg);filter:drop-shadow(0 0 16px var(--c)) brightness(1.3)}50%{transform:translateX(-70%) scale(1.06,.95) rotate(-6deg);filter:none}66%{transform:translateX(-62%)}100%{transform:none}}
.enemy .body.jab{animation:jabL .24s}
@keyframes jabL{50%{transform:translateX(-34%) rotate(-4deg)}}
.body.hit{animation:hitP .42s}
@keyframes hitP{0%{filter:brightness(4) saturate(0)}15%{transform:translateX(-14%) scale(1.04,.92) rotate(-5deg)}45%{transform:translateX(3%) scale(.98,1.02)}100%{transform:none;filter:none}}
.enemy .body.hit{animation:hitE .42s}
@keyframes hitE{0%{filter:brightness(4) saturate(0)}15%{transform:translateX(12%) scale(1.04,.92) rotate(5deg)}45%{transform:translateX(-3%) scale(.98,1.02)}100%{transform:none;filter:none}}
.body.cast{animation:cast2 .6s ease-out}
@keyframes cast2{30%{transform:translateY(-8%) scale(1.04);filter:brightness(1.35) drop-shadow(0 0 18px var(--c))}100%{transform:none;filter:none}}
.body.ult{animation:ult2 1s cubic-bezier(.3,.6,.3,1)}
@keyframes ult2{0%{transform:none}25%{transform:translateY(-16%) scale(1.12);filter:brightness(1.8) drop-shadow(0 0 30px var(--c))}45%{transform:translateY(-16%) scale(1.12);filter:brightness(1.8) drop-shadow(0 0 30px var(--c))}62%{transform:translateX(95%) scale(1.1,.95);filter:none}75%{transform:translateX(88%)}100%{transform:none}}
.unit.enemy.dead{opacity:0;--sc:.9;filter:brightness(2.5) saturate(0) blur(3px);transition:opacity .7s .25s,filter .5s .1s,transform .7s}
.unit.enemy.dead .fig{animation:none;transform:translateY(-14px)}
.ghost{position:fixed;pointer-events:none;z-index:4;filter:brightness(1.6) saturate(.6) drop-shadow(0 0 6px #fff);mix-blend-mode:screen}
/* 조준 */
.ret{position:absolute;inset:-6%;pointer-events:none;opacity:0;transition:.12s;z-index:5;
  background:linear-gradient(#ff5d6c,#ff5d6c) 0 0/26px 4px,linear-gradient(#ff5d6c,#ff5d6c) 0 0/4px 26px,
  linear-gradient(#ff5d6c,#ff5d6c) 100% 0/26px 4px,linear-gradient(#ff5d6c,#ff5d6c) 100% 0/4px 26px,
  linear-gradient(#ff5d6c,#ff5d6c) 0 100%/26px 4px,linear-gradient(#ff5d6c,#ff5d6c) 0 100%/4px 26px,
  linear-gradient(#ff5d6c,#ff5d6c) 100% 100%/26px 4px,linear-gradient(#ff5d6c,#ff5d6c) 100% 100%/4px 26px;background-repeat:no-repeat}
.unit.enemy.aimed .ret,.unit.enemy.tgtable:hover .ret{opacity:1;inset:-2%}
.unit.enemy.aimed .fig{filter:drop-shadow(0 0 10px #ff5d6c)}
/* 의도 */
.intentf{pointer-events:auto;cursor:help}
/* 턴 배너 */
.turnban{position:fixed;left:0;right:0;top:36%;z-index:68;pointer-events:none;text-align:center;padding:14px 0;
  background:linear-gradient(90deg,transparent,rgba(10,14,31,.88) 25%,rgba(10,14,31,.88) 75%,transparent);animation:tban 1.2s ease forwards}
.turnban b{display:block;font-size:clamp(28px,4.5vw,46px);letter-spacing:6px;color:#fff}
.turnban small{display:block;color:var(--dim);margin-top:4px;font-size:13px}
@keyframes tban{0%{opacity:0;transform:scaleY(.2)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
/* 툴팁 */
#tip{position:fixed;z-index:90;pointer-events:none;background:#0d1230;border:1px solid #4a5aa8;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;color:#dfe5ff}
#tip b{color:var(--gold)}
#tip hr{border:0;border-top:1px solid #2c3768;margin:6px 0}
/* 에코(유물) 바 */
.relics{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap}
.relic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:radial-gradient(circle,#3d5aa8,#1b2550);border:1px solid #8aa8ff;cursor:help}
/* 상태이상 카드 · 난이도 */
.card.t-상태{background:linear-gradient(180deg,#2c2c34,#15151a);--c:#8a8aa0!important}
.diffs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:900px}
.diff{width:270px;text-align:left;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.diff b{font-size:15px}.diff small{display:block;color:var(--dim);font-size:11px;margin-top:3px;line-height:1.45}
.diff.on{border-color:#ff9ab0;background:#2a1c33}

/* v2 배치: 전신 캐릭터는 한 줄로 */
.unit.party.s0{left:33%;bottom:15%;--sc:1;z-index:6}
.unit.party.s1{left:20%;bottom:19%;--sc:.8;z-index:5;filter:brightness(.6) saturate(.75)}
.unit.party.s2{left:8%;bottom:23%;--sc:.66;z-index:4;filter:brightness(.5) saturate(.7)}
.unit.party .full{transform:translateY(0)}
.eimg{border-radius:50%}
.eimg img{-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 52%,transparent 71%);mask-image:radial-gradient(circle at 50% 50%,#000 52%,transparent 71%);filter:none}
.eimg::before{inset:4%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 55%,transparent),transparent 72%)}
.unit.enemy{--w:clamp(110px,14vw,170px)}
.unit.enemy.elite{--w:clamp(140px,18vw,215px)}
.unit.enemy.boss{--w:clamp(190px,27vw,320px)}
.unit.enemy .uhud{width:calc(100% + 4px)}

/* ===== v3: 명조 스타일 UI · 슬더스식 지도 · 보스 연출 ===== */
:root{--wu-line:rgba(190,215,255,.28);--wu-acc:#e9d9a6;--cut:12px}
.top,.box,.btn,.choice{border-radius:0;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.btn,.choice{--cut:8px}
.top{background:linear-gradient(90deg,rgba(12,16,34,.92),rgba(22,29,58,.85));border:none;box-shadow:inset 0 0 0 1px var(--wu-line)}
.box{background:linear-gradient(160deg,rgba(24,31,62,.97),rgba(12,16,34,.97));border:none;box-shadow:inset 0 0 0 1px var(--wu-line);position:relative}
.box::before{content:'';position:absolute;left:18px;right:18px;top:8px;height:1px;background:linear-gradient(90deg,transparent,var(--wu-acc),transparent);opacity:.5}
.btn{border:none;box-shadow:inset 0 0 0 1px var(--wu-line);background:rgba(30,40,80,.8)}
.btn:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--wu-acc);transform:none}
.btn.primary{background:linear-gradient(90deg,#2b3a7a,#1b2557);box-shadow:inset 0 0 0 1px #8fb0ff}
.choice{border:none;box-shadow:inset 0 0 0 1px var(--wu-line);background:rgba(28,37,74,.85)}
.choice:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--wu-acc)}
.eng{display:block;font-size:10px;letter-spacing:5px;color:var(--wu-acc);opacity:.8;margin-bottom:2px}
h2{letter-spacing:1px}
/* 지도 */
.mapscr{position:relative;display:grid;grid-template-columns:1fr 150px;gap:14px;align-items:start}
@media (max-width:700px){.mapscr{grid-template-columns:1fr}.maplegend{display:none!important}}
.maphead{grid-column:1/-1;text-align:center;padding:6px 0 2px}
.maphead small{display:block;font-size:10px;letter-spacing:6px;color:var(--wu-acc);opacity:.8}
.maphead b{font-size:22px;letter-spacing:2px}
.mapwrap{width:min(640px,100%);margin:0 auto;background:
  linear-gradient(rgba(140,170,255,.06) 1px,transparent 1px) 0 0/100% 43px,
  linear-gradient(90deg,rgba(140,170,255,.05) 1px,transparent 1px) 0 0/43px 100%,
  radial-gradient(ellipse at 50% 0%,rgba(120,90,200,.25),transparent 60%),rgba(10,14,31,.75);
  box-shadow:inset 0 0 0 1px var(--wu-line);clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);padding:0 8px}
.mlines{position:absolute;inset:0;width:100%;height:100%}
.mlines line{stroke:rgba(150,175,255,.32);stroke-width:2;stroke-dasharray:3 6}
.mlines line.hot{stroke:var(--wu-acc);stroke-width:3;stroke-dasharray:none;filter:drop-shadow(0 0 3px var(--wu-acc))}
.mnode{position:absolute;width:40px;height:40px;transform:translate(-50%,-50%);background:none;border:none;padding:0;display:grid;place-items:center}
.mnode i{width:30px;height:30px;transform:rotate(45deg);display:grid;place-items:center;background:#111833;box-shadow:inset 0 0 0 1.5px var(--c);transition:.15s}
.mnode svg{width:17px;height:17px;transform:rotate(-45deg);fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mnode.t-elite i{width:36px;height:36px}
.mnode.past{opacity:.28}
.mnode.vis i{background:var(--c)}.mnode.vis svg{stroke:#111}
.mnode.avail{cursor:pointer}
.mnode.avail i{box-shadow:inset 0 0 0 2px var(--c),0 0 0 4px rgba(233,217,166,.25);animation:mpulse 1.2s ease-in-out infinite}
.mnode.avail:hover i{transform:rotate(45deg) scale(1.2)}
@keyframes mpulse{50%{box-shadow:inset 0 0 0 2px var(--c),0 0 0 8px rgba(233,217,166,.06)}}
.mnode.cur i{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25)}.mnode.cur svg{stroke:#111}
.mnode.burn i{box-shadow:inset 0 0 0 2px #ff7a3c;background:radial-gradient(circle,#5a1a10,#111833)}
.mnode.burn::after{content:'';position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,rgba(255,120,60,.35),transparent 70%);animation:aura 1.6s ease-in-out infinite;pointer-events:none}
.mboss{position:absolute;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none}
.mboss .bimg{width:130px;height:130px;background:#200d18 center/cover;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);box-shadow:inset 0 0 0 2px #ff5d6c;filter:saturate(.9)}
.mboss span{font-weight:800;letter-spacing:2px;color:#ff9aa8;font-size:14px}
.mboss.avail{cursor:pointer}.mboss.avail .bimg{animation:aura 1.6s ease-in-out infinite}
.maplegend{position:sticky;top:14px;display:flex;flex-direction:column;gap:8px;padding:12px;background:rgba(12,16,34,.85);box-shadow:inset 0 0 0 1px var(--wu-line);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);font-size:12px}
.maplegend small{font-size:10px;letter-spacing:4px;color:var(--wu-acc)}
.lg{display:flex;align-items:center;gap:10px}
.lg i{width:18px;height:18px;transform:rotate(45deg);display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--c);flex:none}

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

const OPT=(()=>{try{return JSON.parse(localStorage.getItem('wuwa-opt'))||{}}catch(e){return {}}})();OPT.speed=OPT.speed||1;if(OPT.sfx==null)OPT.sfx=1;
if(OPT.vol==null)OPT.vol=.7;if(OPT.mini==null)OPT.mini=true;
const VOLV=()=>OPT.mute?0.0001:Math.max(.0001,OPT.vol);

/* 효과음: 파일 없이 WebAudio로 합성 */
let AC=null;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,dur,type,g,f2,t0=0){const a=ac(),t=a.currentTime+t0,o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);v.gain.setValueAtTime(g*.6*VOLV(),t);v.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(v).connect(a.destination);o.start(t);o.stop(t+dur)}
function noise(dur,g,freq,t0=0){const a=ac(),t=a.currentTime+t0,b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const n=a.createBufferSource(),f=a.createBiquadFilter(),v=a.createGain();n.buffer=b;f.type='bandpass';f.frequency.value=freq;v.gain.setValueAtTime(g*.6*VOLV(),t);v.gain.exponentialRampToValueAtTime(.001,t+dur);n.connect(f).connect(v).connect(a.destination);n.start(t)}
const SFX={
  hit:()=>{noise(.12,.55,1200);tone(160,.12,'square',.18,70)},
  crit:()=>{noise(.22,.7,700);tone(110,.25,'sawtooth',.25,40);tone(880,.08,'square',.08,440)},
  hurt:()=>{noise(.16,.5,500);tone(120,.18,'sawtooth',.2,50)},

const YT_DEFAULT={title:'nl_vdjf-jM0',win:'dSy11_e7NF4',over:'wGnPLE_SGw0',boss0:'bNS2ozFgCVA',boss1:'suvkUU54CNA',
  map_coast:'1zORiYv3VmU',battle_coast:'Yr1RlcoqXTg',map_forest:'DrjZLUFlW7Q',battle_forest:'jyc8iS1-rj8',
  map_spire:'Y0yo_cdQP7s',battle_spire:'La24P92A3rM',map_lahai:'wiXzbkjuJao',battle_lahai:'Lixpftlm0Eo'};
const YT_NAME={'nl_vdjf-jM0':'Saving Light',dSy11_e7NF4:'Come To Light',wGnPLE_SGw0:'I Question My Fate',bNS2ozFgCVA:'Oaths Unbent',suvkUU54CNA:'To the Finale',
  '1zORiYv3VmU':"There's No Moonlight This Night",Yr1RlcoqXTg:'Against the Tide',DrjZLUFlW7Q:'The Sound of Lost Joy','jyc8iS1-rj8':'Leaping Waves!',

const ytId=k=>(OPT.yt&&OPT.yt[k])||YT_DEFAULT[k];

function applyVol(){if(BGM.el&&BGM.el.src)BGM.el.volume=OPT.mute?0:.5*OPT.vol;ytCmd(OPT.mute?'mute':'unMute');ytCmd('setVolume',[Math.round(OPT.vol*60)]);

      let opts=[c-1,c,c+1].filter(x=>x>=0&&x<COLS);
      opts=opts.filter(x=>!(x===c+1&&grid[r][c+1]&&grid[r][c+1].nx.has(c))&&!(x===c-1&&grid[r][c-1]&&grid[r][c-1].nx.has(c)));
      const nx=pick(opts);n.nx.add(nx);c=nx;
    }

  const rows=grid.map(row=>row.filter(Boolean));
  rows.forEach(row=>row.forEach((n,i)=>{n.i=i;n.x=(n.c+.5)/COLS+(Math.random()-.5)*.045;n.jy=Math.round((Math.random()-.5)*16)}));

  // 종류 배정 (슬더스 규칙 참고)
  const RC=S.act===0?5:2;

    if(r===0)n.type='battle';else if(r===ROWS-1)n.type='rest';else if(r===8)n.type='treasure';else if(r===RC)n.type='recruit';
    else{
      const parents=r?rows[r-1].filter(m=>m.next.includes(n.i)).map(m=>m.type):[];
      for(let t=0;t<12;t++){
        const x=Math.random();let ty=x<.45?'battle':x<.67?'event':x<.83?'elite':x<.95?'rest':'shop';
        if(r<5&&(ty==='elite'||ty==='rest'))continue;

function hit(T,base,o={}){

/* 교체 · 변주 · 협주 */
function switchCost(){return S.c.switched?1:0}
function doSwitch(id){
  const c=S.c;if(c.busy||id===c.active||S.party[id].down)return;
  const cost=switchCost();if(c.energy<cost)return;
  c.energy-=cost;const out=c.active;const full=c.conc[out]>=3;
  if(full){c.cur=out;outro(out,id);c.conc[out]=0}
  c.active=id;c.cur=id;
  if(!c.switched){if(has('vjun'))gainBlock(5);if(has('zig'))draw(1)}
  c.switched++;
  anim('u-'+id,'enter');
  if(full){FXDELAY=200;intro(id);FXDELAY=0;log(`협주 → 변주! ${CH[out].name} → ${CH[id].name}`);banner(`${CH[out].name} 협주 → ${CH[id].name} 변주`)}
  else log(`${CH[id].name}(으)로 교체`);
  if(c.ghost&&alive().length){c.cur='aem';hit(pick(alive()),c.ghost)}
  afterAction();
}
function outro(id,inc){
  const c=S.c;
  if(id==='rov')alive().forEach(e=>fz(e,2));
  if(id==='aem')c.amp=Math.max(c.amp,2);
  if(id==='sk'){heal(inc,6);c.amp=Math.max(c.amp,1)}
  if(id==='lyn'){c.energy+=1;draw(1)}
  if(id==='mor'){gainBlock(4);c.amp=Math.max(c.amp,1)}
  if(id==='chi'){alive().forEach(e=>unravel(e,2));heal(inc,4)}
  if(id==='cam'){alive().forEach(e=>{e.weak+=1});c.amp=Math.max(c.amp,1)}
}
function intro(id){
  const c=S.c;if(!alive().length)return;
  if(id==='rov'){const T=pick(alive());hit(T,5);fz(T,2)}
  if(id==='aem'){hit(pick(alive()),8);c.amp=Math.max(c.amp,1)}
  if(id==='sk')gainBlock(8);
  if(id==='lyn'){paint(2);const T=pick(alive());hit(T,4);hit(T,4)}
  if(id==='mor')gainBlock(6);
  if(id==='chi'){const T=pick(alive());hit(T,6);unravel(T,2)}
  if(id==='cam')hit(pick(alive()),9);
}
const LIB_TG={rov:1,aem:1,mor:1,cam:1};
function clickLib(){
  const c=S.c;const id=c.active;if(c.busy||c.lib[id]<5)return;

function doLib(T){
  const c=S.c;const id=c.active;c.lib[id]=0;c.cur=id;
  cutIn(id);anim('u-'+id,id==='sk'?'cast':'ult',520);FXDELAY=id==='sk'?600:880;HITSEQ=0;

async function endTurn(){sfx('end');
  const c=S.c;if(c.busy)return;c.busy=true;c.tgt=null;
  discardHandFx();
  for(const x of c.hand){const d=CD[x.id];if(d.eth){c.exhaust.push(x);continue}if(x.id==='burn'){hurtParty(3);pop('party','오염 -3','dmg')}c.discard.push(x)}
  c.hand=[];
  if(wiped()){render();await sleep(600);return lose()}
  turnBanner('적 턴');
  c.amp=Math.max(0,c.amp-1);c.weak=Math.max(0,c.weak-1);
  if(has('mephis')&&c.block===0)gainBlock(6);
  render();await sleep(350);
  for(const e of c.enemies){
    if(e.dead)continue;
    e.block=0;
    if(e.fz>0){dmgEnemy(e,e.fz,true);log(`회절 잔향 폭발 ${e.fz}`);e.fz=Math.max(0,e.fz-1);render();await sleep(300);if(e.dead){if(maybeWin()){render();return}continue}}

    if(m.s){e.str+=m.s;pop(e,`힘 +${m.s}`,'info')}
    if(m.w){c.weak+=m.w;pop('party',`약화 ${m.w}`,'info')}
    if(m.add){const [cid,n,where]=m.add;for(let k=0;k<n;k++){const x=mk(cid);if(where==='draw')c.draw.splice(rnd(0,c.draw.length),0,x);else c.discard.push(x)}pop('party',`${CD[cid].n} +${n}`,'info')}
    log(`${EN[e.id].n} — ${m.n}`);
    if(m.d){anim('e'+e.uid,'atk');render();await sleep(300);
      for(let h=0;h<(m.h||1);h++){if(h)anim('e'+e.uid,'jab');hurtParty(enemyDmg(e,m),e);render();await sleep(h<(m.h||1)-1?200:330);if(wiped()){render();await sleep(700);return lose()}}}
    else{anim('e'+e.uid,'cast');render();await sleep(420)}
    const pv=EN[e.id].pv;if(pv&&pv.k==='metal'&&!e.dead){e.block+=pv.v;pop(e,`+${pv.v} 방어`,'blk');render();await sleep(150)}
  }
  c.enemies.forEach(e=>{if(!e.dead){e.vuln=Math.max(0,e.vuln-1);e.weak=Math.max(0,e.weak-1);e.ur=Math.max(0,e.ur-1);setIntent(e)}});
  c.cards=0;
  c.busy=false;startTurn();
}

  await Promise.all([...ALL,'rovM','aemMecha',...Object.keys(EN)].map(async id=>{

    const states=pre?['attack','cast','hit']:['guard','cast','hit','ultimate'];

let DRAG=null;
function handTop(){const h=$('#hand');return h?h.getBoundingClientRect().top:innerHeight*.7}

function drawArrow(sx,sy,x,y){

function dragStart(ev,kind,uid){
  if(DRAG||ev.button>0)return;
  const c=S.c;if(!c||c.busy||c.ending)return;
  const src=ev.currentTarget;let tg=true;
  if(kind==='card'){
    const card=c.hand.find(x=>x.uid===uid);if(!card)return;const d=CD[card.id];
    if(!canPlay(card))return nope(src,d.unplay?'사용할 수 없는 카드':(d.o!=='any'&&S.party[d.o].down)?'기절한 공명자의 카드':'에너지가 부족합니다');
    tg=!!d.tg;
  }
  ev.preventDefault();ev.stopPropagation();
  const r=src.getBoundingClientRect();let clone=null;
  if(kind==='card'){
    clone=src.cloneNode(true);clone.removeAttribute('onpointerdown');clone.classList.add('dragcard');
    Object.assign(clone.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',transform:'scale(1.06)'});
    $('#fx').appendChild(clone);src.classList.add('ghost');
  }
  DRAG={kind,uid,src,clone,tg,r,ox:ev.clientX-r.left,oy:ev.clientY-r.top,sx:ev.clientX,sy:ev.clientY,aim:false,target:null,moved:false,sticky:false};
  document.body.classList.add('dragging');
  addEventListener('pointermove',dragMove);addEventListener('pointerup',dragUp);addEventListener('pointercancel',dragCancel);
  addEventListener('keydown',dragKey);addEventListener('contextmenu',dragCtx);
  if(kind==='lib')dragMove(ev);
}
function dragMove(ev){
  const D=DRAG;if(!D)return;const x=ev.clientX,y=ev.clientY;
  if(Math.hypot(x-D.sx,y-D.sy)>8)D.moved=true;
  const ht=handTop();
  if(D.kind==='card'){
    if(D.tg&&y<ht+10){
      if(!D.aim){D.aim=true;D.clone.classList.add('aim');
        const hr=$('#hand').getBoundingClientRect();
        D.clone.style.left=(hr.left+hr.width/2-D.r.width/2)+'px';D.clone.style.top=(hr.top-D.r.height*.45)+'px';D.clone.style.transform='scale(1.1)'}
      const hr=$('#hand').getBoundingClientRect();
      drawArrow(hr.left+hr.width/2,hr.top-D.r.height*.45+8,x,y);
      $('#tgthint').textContent='적에게 끌어다 놓으세요';
    }else{
      if(D.aim){D.aim=false;D.clone.classList.remove('aim');hideArrow();$('#tgthint').textContent=''}
      const tilt=Math.max(-12,Math.min(12,(ev.movementX||0)*1.2));
      D.clone.style.left=(x-D.ox)+'px';D.clone.style.top=(y-D.oy)+'px';D.clone.style.transform=`scale(1.1) rotate(${tilt}deg)`;
      D.clone.classList.toggle('armed',!D.tg&&y<ht-20);
    }
  }else{
    const r=D.src.getBoundingClientRect();D.aim=true;drawArrow(r.left+r.width/2,r.top,x,y);
  }
  let T=null;
  if(D.tg&&D.aim){const el=document.elementFromPoint(x,y);const u=el&&el.closest('.unit.enemy');if(u)T=S.c.enemies.find(e=>'e-'+e.uid===u.id&&!e.dead)||null}
  if(T!==D.target){document.querySelectorAll('.unit.enemy.aimed').forEach(e=>e.classList.remove('aimed'));if(T)$('#e-'+T.uid).classList.add('aimed');D.target=T}
  const a=$('#arrow');if(a)a.classList.toggle('hot',!!T);
}
function dragUp(ev){
  const D=DRAG;if(!D)return;
  dragMove(ev);
  // 움직이지 않고 떼면: 카드를 든 상태로 유지(다음 클릭으로 사용)
  if(!D.moved&&!D.sticky){D.sticky=true;if(D.kind==='card'&&D.tg){D.sy=-999;}return}
  const ht=handTop();
  if(D.kind==='lib'){endDrag();if(D.target)doLib(D.target);else render();return}
  const card=S.c.hand.find(x=>x.uid===D.uid);
  let T=null,play=false;
  if(D.tg){if(D.target){play=true;T=D.target}}
  else if(ev.clientY<ht-20)play=true;
  endDrag();
  if(play&&card&&canPlay(card)){flyClone(D.clone,T);playCard(D.uid,T||alive()[0])}
  else returnClone(D);
}
function dragCancel(){const D=DRAG;if(!D)return;endDrag();if(D.clone)returnClone(D);else render()}
function dragKey(e){if(e.key==='Escape')dragCancel()}
function dragCtx(e){e.preventDefault();dragCancel()}
function endDrag(){
  removeEventListener('pointermove',dragMove);removeEventListener('pointerup',dragUp);removeEventListener('pointercancel',dragCancel);
  removeEventListener('keydown',dragKey);removeEventListener('contextmenu',dragCtx);

    cl.style.transform=`translate(${tx-r.left-r.width/2}px,${ty-r.top-r.height/2}px) scale(.35) rotate(${T?12:-8}deg)`;cl.style.opacity='0'});

function overHTML(){return `<div class="screen"><div class="box" style="text-align:center"><h2 style="color:var(--red)">모든 공명자가 쓰러졌습니다</h2>
  <p>${ACTS[S.act].name} · 층 ${S.floor} · 처치한 잔상 ${S.stats.kills}</p><p class="dim">잔향은 사라지지 않습니다. 다시 탑에 오르세요.</p>
  <button class="btn gold" onclick="goMenu('select')">다시 도전</button> <button class="btn" onclick="goMenu('title')">타이틀</button></div></div>`}
function winHTML(){return `<div class="screen"><div class="box" style="text-align:center"><div style="font-size:46px">✹</div><h2 style="color:var(--gold)">첨탑 정복!</h2>
  <p>알레프-원의 창조물이 무너지고, 탑 꼭대기에 고요한 별빛이 내려앉습니다.</p>
  <p>층 ${S.floor} · 처치한 잔상 ${S.stats.kills} · 에코 ${S.echoes.length}개 · 덱 ${S.deck.length}장</p>
  <button class="btn gold" onclick="goMenu('select')">다시 오르기</button> <button class="btn" onclick="goMenu('title')">타이틀</button></div></div>`}
function modalHTML(){
  const m=S.modal;
  if(m.kind==='deck'){
    const sorted=[...S.deck].sort((a,b)=>ALL.indexOf(CD[a.id].o)-ALL.indexOf(CD[b.id].o));
    return `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box"><h2>덱 (${S.deck.length}장)</h2>
      <div class="cards" style="margin-top:14px">${sorted.map(c=>cardHTML(c)).join('')}</div>
      <div style="text-align:center;margin-top:16px"><button class="btn" onclick="closeModal()">닫기</button></div></div></div>`;
  }
  if(m.kind==='map')return `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box" style="max-width:1000px;padding:10px"><div style="text-align:right"><button class="btn" onclick="closeModal()">닫기</button></div>${mapHTML(true)}</div></div>`;
  if(m.kind==='pause'){const inMap=S.screen==='map';
    return `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box pause"><h2>일시정지</h2>
      <p class="dim">${ACTS[S.act].name} · ${S.floor}층 · ${S.team.map(id=>CH[id].name).join(', ')}</p>
      <div class="choices">
        <button class="choice" onclick="closeModal()"><b>계속하기</b></button>
        <button class="choice" onclick="showDeck()"><b>덱 보기</b></button>
        <button class="choice" onclick="toggleFS()"><b>전체 화면</b></button>
        <button class="choice" onclick="OPT.speed=OPT.speed===1?2:1;saveOpt();render()"><b>전투 속도 ×${OPT.speed}</b><small>적 턴·연출 대기 시간을 줄여요</small></button>
        <button class="choice" onclick="OPT.sfx=OPT.sfx?0:1;saveOpt();render()"><b>효과음 ${OPT.sfx?'켜짐':'꺼짐'}</b></button>
        <button class="choice" onclick="OPT.bgm=OPT.bgm?0:1;saveOpt();render()"><b>배경음 ${OPT.bgm?'켜짐':'꺼짐'}</b><small>명조 공식 OST(유튜브) · assets/bgm의 mp3가 있으면 우선</small></button>
        <div class="choice" style="display:flex;align-items:center;gap:10px"><b style="flex:1">전체 음량</b><button class="btn" onclick="toggleMute();render()">${OPT.mute?'🔇 음소거됨':'🔊'}</button><input type="range" min="0" max="1" step="0.05" value="${OPT.vol}" oninput="setVol(this.value)" style="accent-color:#e9d9a6"></div>
        <button class="choice" onclick="setYt()"><b>지금 장면 배경음 바꾸기</b><small>유튜브 링크를 붙여 넣으세요</small></button>
        <button class="choice" onclick="toTitle()"><b>저장하고 타이틀로</b><small>${inMap?'지금 위치가 저장돼요.':'진행 중인 전투·사건은 저장되지 않고, 마지막 지도 위치부터 이어해요.'}</small></button>
        <button class="choice" onclick="abandonRun()"><b>이번 판 포기</b><small>저장을 지우고 타이틀로 돌아가요.</small></button>
        ${IS_APP?`<button class="choice" onclick="quitGame()"><b>게임 종료</b><small>${inMap?'지금 위치를 저장하고 종료해요.':'마지막 지도 위치부터 이어할 수 있어요.'}</small></button>`:''}
      </div></div></div>`}
  if(m.kind==='pile')return `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box"><h2>${m.title}</h2>
      <div class="cards" style="margin-top:14px">${m.list.map(c=>cardHTML(c)).join('')||'<p class="dim">비어 있음</p>'}</div>
      <div style="text-align:center;margin-top:16px"><button class="btn" onclick="closeModal()">닫기</button></div></div></div>`;
  return `<div class="modal"><div class="box"><h2>${m.title}</h2>
    <div class="cards" style="margin-top:14px">${m.list.map(c=>cardHTML(c,{click:`modalPick(${c.uid})`})).join('')}</div>
    <div style="text-align:center;margin-top:16px"><button class="btn" onclick="closeModal()">취소</button></div></div></div>`;
}
render();loadArt().then(render);
</script>
</body>
</html>
