<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>명조: 첨탑의 메아리</title>
<style>
:root{
  --bg:#0b0f1d; --bg2:#121833; --panel:#161d3a; --panel2:#1d2650; --line:#2c3768;
  --text:#e8ecff; --dim:#98a2cf; --gold:#ffd75e; --red:#ff5d6c; --green:#5be3a1; --blue:#6fb6ff;
  --rov:#f3d36b; --aem:#ff8a5c; --sk:#b7a6ff; --any:#9fb3d9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#24306a 0%,var(--bg) 60%) fixed,var(--bg);color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:14px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:1200px;margin:0 auto;padding:12px 16px 12px;min-height:100vh;display:flex;flex-direction:column}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 16px;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--gold);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(180deg,#3b4aa0,#2a3578);border-color:#5d6fd0}
.btn.gold{background:linear-gradient(180deg,#8a6a1c,#5e4612);border-color:var(--gold)}
h1,h2,h3{margin:0}
.dim{color:var(--dim)}
/* top bar */
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:rgba(22,29,58,.85);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.top .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.echo{cursor:help;border-color:#3d5aa8}
/* title */
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:30px 0}
.title h1{font-size:40px;letter-spacing:2px;background:linear-gradient(90deg,var(--sk),var(--gold),var(--aem));-webkit-background-clip:text;background-clip:text;color:transparent}
.party-intro{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:1000px}
.pi.sel{cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.pi.sel:hover{border-color:var(--c);transform:translateY(-4px);box-shadow:0 10px 26px -8px var(--c)}
.pi .kit{font-size:11px;color:var(--dim);padding-left:15px;margin:8px 0 0;line-height:1.5;flex:1}
.pi .pick{margin-top:10px;text-align:center;font-weight:800;color:var(--c);border:1px solid var(--c);border-radius:9px;padding:6px}
.pi{width:220px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.pi .av{width:84px;height:84px;border:2px solid #fff3;border-radius:14px;display:grid;place-items:center;font-size:24px;font-weight:800;color:#111;margin-bottom:8px}
.pi p{margin:6px 0 0;font-size:12px;line-height:1.5;color:var(--dim)}
.howto{max-width:640px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:13px;line-height:1.7;color:var(--dim)}
.howto b{color:var(--text)}
.titlescr{position:relative;flex:1;min-height:calc(100vh - 24px);border-radius:20px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;isolation:isolate;text-align:center;padding:40px 16px 56px}
.t-logo h1{font-size:clamp(46px,8vw,96px);letter-spacing:8px;margin:8px 0 4px;background:linear-gradient(90deg,#c9b8ff,#ffe9a8 50%,#ff9a7a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 26px rgba(255,215,140,.4));animation:tglow 4s ease-in-out infinite}
@keyframes tglow{50%{filter:drop-shadow(0 4px 40px rgba(200,180,255,.6))}}
.t-sub{letter-spacing:6px;font-size:12px;color:var(--dim)}
.t-en{font-family:Georgia,'Times New Roman',serif;font-style:italic;letter-spacing:4px;color:#cfd6ff;opacity:.85}
.t-party{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.t-party .tp{width:clamp(46px,6.5vw,72px);aspect-ratio:1;border-radius:50%;border:2px solid var(--c);background-color:#0c1126;box-shadow:0 0 20px -4px var(--c);animation:idle 3.2s ease-in-out infinite;display:grid;place-items:center;font-weight:800}
.t-menu{display:flex;flex-direction:column;gap:10px;width:min(330px,100%)}
.t-menu button{padding:13px 18px;border-radius:12px;font-size:17px;font-weight:800;background:rgba(22,29,58,.78);border:1px solid #4a5aa8;backdrop-filter:blur(4px);transition:.15s}
.t-menu button:hover{border-color:var(--gold);transform:translateX(4px);box-shadow:0 0 22px -6px var(--gold)}
.t-menu button.main{background:linear-gradient(180deg,#8a6a1c,#5e4612);border-color:var(--gold)}
.t-menu small{display:block;font-size:11px;font-weight:400;color:#e8dcb8;margin-top:3px}
.t-foot{position:absolute;bottom:14px;left:16px;right:16px;font-size:11px;color:var(--dim)}
.backbtn{align-self:flex-start}
/* map */
.mapwrap{position:relative;margin:0 auto;width:min(560px,100%);}
.map{position:relative}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,50%);width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:12px;font-weight:700;line-height:1}
.node.avail{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,215,94,.18);animation:pulse 1.4s infinite}
.node.done{opacity:.45}
.node.cur{border-color:#fff;background:#3b4aa0}
.node.boss{width:76px;height:76px;font-size:13px;border-color:var(--red)}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,215,94,.06)}}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 12px;font-size:12px}
/* ===== 전투 무대 ===== */
#screen{flex:1;display:flex;flex-direction:column}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#111;flex:none}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);white-space:nowrap}
.combat{flex:1;display:flex;flex-direction:column;min-height:calc(100vh - 100px)}
.stage{position:relative;flex:1;min-height:400px;border-radius:18px;overflow:hidden;border:1px solid var(--line);isolation:isolate;--pw:clamp(84px,13vw,150px)}
.stage.shake{animation:stshake .35s}
@keyframes stshake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.bgsvg{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.mote{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.0;z-index:-1;animation:mote 7s linear infinite}
@keyframes mote{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-220px);opacity:0}}
.stlog{position:absolute;left:12px;top:10px;font-size:12px;color:var(--dim);background:rgba(8,10,22,.55);padding:6px 10px;border-radius:10px;max-width:44%;line-height:1.5;z-index:20;pointer-events:none}
.stlog div:last-child{color:var(--text)}
.stlog:empty{display:none}
.tgthint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:20;background:rgba(40,30,0,.8);border:1px solid var(--gold);color:var(--gold);padding:6px 12px;border-radius:10px;font-size:13px}
.tgthint:empty{display:none}
.unit{position:absolute;width:var(--w,var(--pw));transform:translateX(-50%) scale(var(--sc,1));transform-origin:50% 100%;
  transition:left .5s cubic-bezier(.3,1.25,.5,1),bottom .5s cubic-bezier(.3,1.25,.5,1),transform .5s,filter .45s,opacity .6s;display:flex;flex-direction:column;align-items:center}
.unit .body{position:relative;width:100%}
.unit .fig{animation:idle 2.8s ease-in-out infinite;animation-delay:var(--dl,0s);position:relative;z-index:1}
@keyframes idle{50%{transform:translateY(-6px)}}
.unit .shadow{position:absolute;left:8%;right:8%;bottom:-10px;height:18px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.6),transparent 70%)}
.unit.party.s0{left:33%;bottom:21%;--sc:1;z-index:6}
.unit.party.s1{left:9%;bottom:50%;--sc:.6;z-index:3;filter:brightness(.55) saturate(.7)}
.unit.party.s2{left:17%;bottom:16%;--sc:.66;z-index:4;filter:brightness(.55) saturate(.7)}
.unit.party.swappable{cursor:pointer}
.unit.party.swappable:hover{filter:brightness(.95) saturate(1)}
.unit.party.down{filter:grayscale(1) brightness(.35)!important}
.unit.party.down .fig{animation:none;transform:rotate(-8deg) translateY(10px)}
.unit.enemy{--w:clamp(90px,12vw,140px);z-index:5}
.unit.enemy.elite{--w:clamp(110px,15vw,175px)}
.unit.enemy.boss{--w:clamp(160px,24vw,270px)}
.unit.enemy.tgtable{cursor:crosshair}
.unit.enemy.tgtable .fig{filter:drop-shadow(0 0 10px var(--gold)) drop-shadow(0 0 2px var(--gold))}
.unit.enemy.tgtable:hover{--sc:1.06}
.unit.enemy.dead{opacity:0;--sc:.8;pointer-events:none;filter:brightness(3) blur(2px)}
.stand{width:100%;aspect-ratio:4/5;border-radius:18px 18px 40% 40%/18px 18px 22% 22%;overflow:hidden;border:2px solid var(--c);background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 45%,#0c1126),#0c1126 75%);
  box-shadow:0 0 26px -6px var(--c),inset 0 -30px 40px -20px rgba(0,0,0,.8);position:relative}
.stand img{width:118%;margin-left:-9%;margin-top:4%;display:block}
.stand i{position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,color-mix(in srgb,var(--c) 35%,transparent));pointer-events:none}
.eimg{width:100%;aspect-ratio:1;position:relative}
.eimg::before{content:'';position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 45%,transparent),transparent 70%);z-index:-1}
.eimg img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c) 70%,transparent)) drop-shadow(0 8px 6px rgba(0,0,0,.55))}
.sprite{width:100%;aspect-ratio:1;overflow:hidden;position:relative}
.sprite img{display:block;height:100%;image-rendering:pixelated;animation-name:spr;animation-iteration-count:infinite}
@keyframes spr{to{transform:translateX(-100%)}}
.ph{width:100%;display:block;filter:drop-shadow(0 0 12px var(--c))}
.uhud{width:calc(100% + 26px);max-width:200px;margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;z-index:2}
.unit.enemy.boss .uhud{max-width:280px}
.hpb{position:relative;width:100%;height:15px;background:#1c0b10;border:1px solid #000;border-radius:8px;overflow:visible;box-shadow:0 2px 4px rgba(0,0,0,.6)}
.hpb i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.hpb i.lag{background:#ffcf9a;transition:width .8s .3s}
.hpb i.cur{background:linear-gradient(#ff7b7b,#c0303d);transition:width .3s}
.unit.party .hpb i.cur{background:linear-gradient(#6af0ae,#1f9e64)}
.hpb span{position:relative;display:block;text-align:center;font-size:11px;font-weight:800;line-height:14px;text-shadow:0 1px 2px #000,0 0 3px #000}
.hpb.blocked{border-color:#7cc0ff;box-shadow:0 0 0 1px #7cc0ff,0 0 10px #3d7bd9}
.hpb .blk{position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:28px;height:30px;display:none;place-items:center;font-size:12px;font-weight:800;
  background:linear-gradient(#6aa8ff,#2a5fc0);clip-path:polygon(50% 0,100% 15%,92% 65%,50% 100%,8% 65%,0 15%);text-shadow:0 1px 2px #000}
.hpb.blocked .blk{display:grid}
.nametag{font-size:11px;color:var(--dim);white-space:nowrap;text-shadow:0 1px 2px #000}
.nametag b{color:var(--text)}
.sts{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.st{font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(10,14,31,.85);border:1px solid var(--line);white-space:nowrap}
.gauges{display:flex;gap:2px;align-items:center}
.gp{width:11px;height:5px;border-radius:3px;background:rgba(0,0,0,.6);border:1px solid #39446f}
.gp.on{background:var(--c);border-color:var(--c);box-shadow:0 0 5px var(--c)}
.gp.l{width:7px}.gp.l.on{background:#fff;border-color:#fff;box-shadow:0 0 6px #fff}
.gsep{width:5px}
.intentf{position:absolute;top:-34px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;font-weight:900;font-size:17px;white-space:nowrap;z-index:3;
  text-shadow:0 2px 3px #000,0 0 4px #000;animation:float 1.8s ease-in-out infinite;pointer-events:none}
.intentf svg{width:26px;height:26px;filter:drop-shadow(0 2px 2px #000)}
.intentf .in-atk{color:#ff6d7c}.intentf .in-def{color:#7cc0ff}.intentf .in-buf{color:#ffd75e}.intentf .in-deb{color:#c58cff}
@keyframes float{50%{transform:translateX(-50%) translateY(-5px)}}
.swaptag{position:absolute;top:-26px;left:50%;transform:translateX(-50%) scale(1.4);font-size:11px;white-space:nowrap;background:rgba(10,14,31,.9);border:1px solid var(--c);color:var(--c);padding:2px 8px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:4}
.unit.swappable:hover .swaptag{opacity:1}
.swaptag.ready{opacity:.9;border-color:var(--gold);color:var(--gold)}
.libwrap{position:absolute;top:-44px;left:50%;transform:translateX(-50%);z-index:8}
.libbtn{white-space:nowrap;padding:6px 14px;border-radius:999px;border:1px solid #fff;background:linear-gradient(90deg,#4a3c9c,#a24fa0);font-weight:800;font-size:13px;animation:pulse 1.4s infinite;box-shadow:0 0 18px #b47cff}
/* 행동 연출 */
.body.atk{animation:lungeR .45s cubic-bezier(.2,.8,.3,1)}
.enemy .body.atk{animation:lungeL .45s cubic-bezier(.2,.8,.3,1)}
.enemy .body.jab{animation:jabL .22s}
@keyframes lungeR{0%{transform:none}30%{transform:translateX(26%) translateY(-4%) scale(1.06)}45%{transform:translateX(70%) scale(1.08)}100%{transform:none}}
@keyframes lungeL{0%{transform:none}30%{transform:translateX(-26%) translateY(-4%) scale(1.06)}45%{transform:translateX(-70%) scale(1.08)}100%{transform:none}}
@keyframes jabL{50%{transform:translateX(-30%)}}
.body.hit{animation:hitP .4s}
.enemy .body.hit{animation:hitE .4s}
@keyframes hitP{0%{filter:brightness(3) saturate(0)}25%{transform:translateX(-12%) rotate(-3deg)}60%{transform:translateX(4%)}100%{transform:none;filter:none}}
@keyframes hitE{0%{filter:brightness(3) saturate(0)}25%{transform:translateX(10%) rotate(3deg)}60%{transform:translateX(-3%)}100%{transform:none;filter:none}}
.body.cast{animation:cast .55s}
.enemy .body.cast{animation:castE .6s}
@keyframes cast{40%{transform:translateY(-10%) scale(1.05);filter:brightness(1.5) drop-shadow(0 0 18px var(--c))}}
@keyframes castE{40%{transform:scale(1.1);filter:brightness(1.4) drop-shadow(0 0 18px var(--c))}}
.body.ult{animation:ult .9s}
@keyframes ult{0%{transform:none}25%{transform:translateY(-18%) scale(1.15);filter:brightness(2) drop-shadow(0 0 30px #fff)}45%{transform:translateY(-18%) scale(1.15);filter:brightness(2) drop-shadow(0 0 30px #fff)}65%{transform:translateX(90%) scale(1.1)}100%{transform:none;filter:none}}
.body.block{animation:blockP .35s}
@keyframes blockP{40%{filter:drop-shadow(0 0 16px #6fb6ff) brightness(1.3);transform:translateX(-4%)}}
/* 하단 */
.bottom{position:relative;height:178px;margin-top:-62px;z-index:30;pointer-events:none}
.lhud,.rhud,.hand .card{pointer-events:auto}
.lhud,.rhud{z-index:90}
.lhud{position:absolute;left:6px;bottom:8px;display:flex;flex-direction:column;align-items:center;gap:10px}
.rhud{position:absolute;right:6px;bottom:8px;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.energy{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:21px;font-weight:900;color:#2a1c00;
  background:radial-gradient(circle at 40% 35%,#fff3c4,#f2b632 55%,#a86f0a);border:3px solid #fff3c4;box-shadow:0 0 22px rgba(255,200,80,.55);text-shadow:0 1px 0 #fff6}
.energy.zero{filter:grayscale(.8) brightness(.6);box-shadow:none}
.pile{width:56px;height:70px;border-radius:10px;border:2px solid #6f7fc9;background:linear-gradient(160deg,#2f3d86,#18204a);font-weight:900;font-size:16px;position:relative;box-shadow:3px 3px 0 #10163a,6px 6px 0 #0b0f28}
.pile small{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--dim);white-space:nowrap;font-weight:400}
.pile.disc{border-color:#a96f7f;background:linear-gradient(160deg,#6a2f45,#2a1424);box-shadow:-3px 3px 0 #2a1020,-6px 6px 0 #1a0a14}
.endturn{padding:13px 20px;border-radius:14px;font-weight:900;font-size:15px;background:linear-gradient(#41b0b4,#1f6a78);border:2px solid #aef6f2;box-shadow:0 0 16px rgba(80,220,220,.35);transition:.15s}
.endturn:hover:not(:disabled){transform:scale(1.05)}
.endturn:disabled{filter:grayscale(1) brightness(.6);cursor:default}
.endturn.glow{animation:pulse 1.3s infinite}
.hand{position:absolute;left:96px;right:120px;bottom:0;top:0}
.hand .card{position:absolute;bottom:-26px;transform-origin:50% 130%;transition:transform .18s,left .25s,filter .2s}
.hand .card:hover:not(.off),.hand .card.sel{z-index:80!important;transform:translateX(-50%) translateY(-52px) rotate(0) scale(1.14)!important}
/* 카드 */
.card{width:150px;height:210px;flex:none;border-radius:13px;position:relative;cursor:pointer;background:linear-gradient(180deg,#26306a,#141a3a);border:2px solid var(--c);
  box-shadow:0 8px 18px rgba(0,0,0,.55);display:flex;flex-direction:column;padding:6px 7px 7px;text-align:center;user-select:none;transition:transform .15s}
.card.t-공격{background:linear-gradient(180deg,#4a2433,#1d1226)}
.card.t-파워{background:linear-gradient(180deg,#4a3d1c,#1f1a10)}
.card.t-저주{background:linear-gradient(180deg,#2a2a2a,#101010);--c:#666!important}
.cards .card:hover:not(.off){transform:translateY(-6px)}
.card.off{filter:grayscale(.55) brightness(.6);cursor:default}
.card .cost{position:absolute;top:-9px;left:-9px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;z-index:2;
  background:radial-gradient(circle at 40% 35%,#fff3c4,#e2a422 60%,#9a6408);color:#2a1c00;border:2px solid #fff3c4;box-shadow:0 2px 4px #000}
.card .cost.up{background:radial-gradient(circle at 40% 35%,#ffd6db,#ff5d6c 60%,#9a1f2c);border-color:#ffd0d5;color:#fff}
.card .nm{margin:2px -11px 0;padding:4px 6px;font-weight:800;font-size:12.5px;line-height:1.2;color:#14101e;border-radius:4px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 92%,#fff),var(--c));box-shadow:0 2px 3px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .nm.u{color:#0b4a24}
.card .art{height:76px;margin-top:6px;border-radius:8px 8px 3px 3px;background-color:#0c1126;background-repeat:no-repeat;border:1px solid rgba(255,255,255,.18);position:relative;overflow:hidden}
.card .art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.55))}
.card .art .sym{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:var(--c);opacity:.9;z-index:1}
.card .ty{font-size:10px;margin:-8px auto 0;position:relative;z-index:1;background:#0b0f1d;border:1px solid var(--c);padding:0 8px;border-radius:999px;width:max-content;color:var(--dim)}
.card .tx{font-size:11.5px;line-height:1.38;flex:1;display:grid;place-items:center;padding:3px 1px;color:#eef}
.card .ow{font-size:10px;color:var(--c);font-weight:700}
.card .wait{position:absolute;top:-9px;right:-6px;font-size:9.5px;background:#5a1d28;color:#ffc2c9;border:1px solid #ff8a96;border-radius:6px;padding:1px 5px;z-index:2}
.hand .card{touch-action:none}
.hand .card:not(.off){cursor:grab}
.hand .card.ghost{opacity:0!important;pointer-events:none}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
body.dragging .hand .card{pointer-events:none}
.dragcard{position:fixed!important;z-index:75;pointer-events:none;margin:0!important;transition:transform .1s;box-shadow:0 20px 44px rgba(0,0,0,.65)}
.dragcard.aim{transition:left .16s,top .16s,transform .16s;box-shadow:0 0 0 3px var(--gold),0 0 34px rgba(255,215,94,.6)}
.dragcard.armed{box-shadow:0 0 0 3px var(--gold),0 0 34px rgba(255,215,94,.7)}
.dragcard.back{transition:left .2s,top .2s,transform .2s,opacity .3s}
.card.nope{animation:nope .3s}
@keyframes nope{25%{margin-left:-8px}75%{margin-left:8px}}
#arrow{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:74;display:none;overflow:visible}
#arrow .ln{fill:none;stroke:#ffd75e;stroke-width:11;stroke-linecap:round;stroke-dasharray:1 17;animation:adash .45s linear infinite;filter:drop-shadow(0 0 6px #ffb800)}
#arrow #ah path{fill:#ffd75e}
#arrow.hot .ln{stroke:#ff5d6c;filter:drop-shadow(0 0 8px #ff2040)}
#arrow.hot #ah path{fill:#ff5d6c}
@keyframes adash{to{stroke-dashoffset:-18}}
.unit.enemy.aimed{--sc:1.07}
.unit.enemy.aimed .fig{filter:drop-shadow(0 0 14px #ff5d6c) drop-shadow(0 0 3px #fff)}
.flycard{position:fixed;z-index:70;pointer-events:none;transition:transform .32s cubic-bezier(.4,0,.6,1),opacity .32s;margin:0!important}
@media (max-width:640px){
  .card{width:112px;height:162px;padding:5px}
  .card .art{height:52px}.card .nm{font-size:11px}.card .tx{font-size:10px}
  .hand{left:70px;right:84px}.energy{width:56px;height:56px;font-size:17px}.pile{width:44px;height:56px}
  .endturn{padding:10px 12px;font-size:13px}.bottom{height:140px}.hand .card{bottom:-38px}
  .stage{min-height:360px}
}
/* generic panels */
.screen{flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:680px;width:100%}
.box p{line-height:1.7}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.choice{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.choice:hover:not(:disabled){border-color:var(--gold)}
.choice:disabled{opacity:.4;cursor:default}
.choice small{display:block;color:var(--dim);margin-top:3px}
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.shopitem{display:flex;flex-direction:column;align-items:center;gap:6px}
.price{font-size:12px;color:var(--gold)}
.modal{position:fixed;inset:0;background:rgba(5,7,15,.82);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 16px}
.modal .box{max-width:980px}
.echoicon{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:radial-gradient(circle,#3d5aa8,#1b2550);border:2px solid #8aa8ff;margin:0 auto}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.pop{position:absolute;font-weight:800;font-size:20px;text-shadow:0 2px 4px #000;animation:pop .9s ease-out forwards}
.pop.dmg{color:#ff6d7c}.pop.heal{color:var(--green)}.pop.blk{color:var(--blue)}.pop.info{color:var(--gold);font-size:15px}
@keyframes pop{0%{transform:translate(-50%,0) scale(.8);opacity:0}15%{opacity:1;transform:translate(-50%,-8px) scale(1.1)}100%{transform:translate(-50%,-46px);opacity:0}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:rgba(10,14,31,.92);border:1px solid var(--gold);border-radius:14px;padding:14px 26px;font-size:18px;font-weight:700;z-index:55;pointer-events:none;animation:ban 1.1s forwards}
@keyframes ban{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
</style>

/* ============ 지도 ============ */
const NODE={battle:{l:'전투',s:'⚔',c:'#c9d2ff'},elite:{l:'정예',s:'☠',c:'#ff8a8a'},event:{l:'사건',s:'?',c:'#9fe8c8'},
  rest:{l:'휴식',s:'☾',c:'#ffd75e'},shop:{l:'상점',s:'$',c:'#ffb36b'},treasure:{l:'보급',s:'◈',c:'#8ab4ff'},recruit:{l:'영입',s:'✚',c:'#7cf0c0'},boss:{l:'명식',s:'✹',c:'#ff5d6c'}};
const ROWS=12;
function nodeType(r){
  if(r===0)return'battle';if(r===ROWS-1)return'rest';if(r===6)return'treasure';
  if((S.act===0&&r===4)||(S.act===1&&r===1))return'recruit';
  const x=Math.random();
  if(r<3)return x<.55?'battle':x<.88?'event':'shop';
  return x<.4?'battle':x<.64?'event':x<.8?'elite':x<.9?'rest':'shop';
}
function genMap(){
  const rows=[];
  for(let r=0;r<ROWS;r++){const n=(r===0||r===ROWS-1)?3:rnd(2,4);rows.push(Array.from({length:n},(_,i)=>({r,i,x:(i+.5)/n,type:nodeType(r),next:[]})))}
  const near=(arr,x)=>arr.reduce((b,n,j)=>Math.abs(n.x-x)<Math.abs(arr[b].x-x)?j:b,0);
  const cross=(A,i,j)=>A.some((a,k)=>a.next.some(t=>(k<i&&t>j)||(k>i&&t<j)));
  for(let r=0;r<ROWS-1;r++){
    const A=rows[r],B=rows[r+1];
    A.forEach(a=>a.next.push(near(B,a.x)));
    B.forEach((b,j)=>{if(!A.some(a=>a.next.includes(j))){const i=near(A,b.x);if(!A[i].next.includes(j))A[i].next.push(j)}});
    A.forEach((a,i)=>{if(Math.random()<.45){const j=a.next[0]+(Math.random()<.5?-1:1);if(j>=0&&j<B.length&&!a.next.includes(j)&&!cross(A,i,j))a.next.push(j)}});
    // 같은 줄 연속 휴식/정예 방지
    B.forEach((b,j)=>{if(r+1<ROWS-1&&['rest','elite','shop'].includes(b.type)&&A.some(a=>a.next.includes(j)&&a.type===b.type))b.type='event'});
  }
  return rows;
}
function availNodes(){
  if(!S.pos)return S.map[0].map(n=>`0-${n.i}`);
  if(S.pos.r===ROWS-1)return['boss'];
  if(S.pos.r===ROWS)return[];
  return S.map[S.pos.r][S.pos.i].next.map(j=>`${S.pos.r+1}-${j}`);
}
function enterNode(key){
  if(!availNodes().includes(key))return;
  S.floor++;
  if(key==='boss'){S.pos={r:ROWS,i:0};return startCombat([ACTS[S.act].boss],'boss')}
  const [r,i]=key.split('-').map(Number);S.pos={r,i};
  const t=S.map[r][i].type;
  if(t==='battle'){const A=ACTS[S.act];startCombat(pick(S.fights<2?A.easy:A.normal),'battle');S.fights++}
  else if(t==='elite')startCombat(pick(ACTS[S.act].elite),'elite');
  else if(t==='event')startEvent();
  else if(t==='rest'){S.screen='rest';S.restDone=false;render()}
  else if(t==='shop')openShop();
  else if(t==='recruit')openRecruit();
  else if(t==='treasure'){const pool=TREASURE_ECHO.filter(e=>!has(e));const e=pool.length?pick(pool):null;const g=rnd(30,50);S.gold+=g;gainEcho(e);
    S.screen='msg';S.msg={title:'보급 상자',body:`낡은 보급 상자를 열었습니다.<br>조개 화폐 <b>+${g}</b>${e?`<br>에코 <b>${ECHO[e].n}</b> 획득 — ${ECHO[e].tx}`:''}`};render()}
}

/* ============ 전투 ============ */
const alive=()=>S.c.enemies.filter(e=>!e.dead);
function spawn(id){
  const d=EN[id];const k=d.boss||d.elite?1:S.act===1?1.2:1.1;
  const hp=Math.round(rnd(d.hp[0],d.hp[1])*k);
  return{uid:UID++,id,hp,maxHp:hp,block:0,str:0,weak:0,vuln:0,fz:0,ur:0,dead:false,mi:d.boss?0:rnd(0,d.m.length-1),bonus:d.boss?0:(S.act===1?3:1)};
}
function startCombat(ids,kind){
  const lead=T_().find(id=>!S.party[id].down);
  S.c={kind,enemies:ids.map(spawn),draw:shuffle(S.deck.map(c=>({...c}))),discard:[],hand:[],exhaust:[],energy:0,block:0,amp:0,weak:0,
    field:{t:0,b:0},orbit:0,melody:0,ghost:0,mecha:false,active:lead,conc:Object.fromEntries(T_().map(id=>[id,0])),lib:Object.fromEntries(T_().map(id=>[id,0])),paint:0,bloom:0,calc:0,calcNow:0,nextE:0,hyp:0,bond:0,freeBrush:0,camUni:0,
    switched:0,turn:0,tgt:null,log:[],busy:false,cur:lead,id:UID++};
  S.c.enemies.forEach(setIntent);
  if(has('gulp'))S.c.conc[lead]=3;

  if(has('tuner'))T_().forEach(id=>S.c.lib[id]+=2);

  if(has('hoar'))S.c.block+=10;
  S.screen='combat';
  log(kind==='boss'?`명식 「${EN[ids[0]].n}」 출현!`:kind==='elite'?'강력한 잔상이 앞을 가로막습니다.':'잔상과 조우했습니다.');
  startTurn();
  if(kind==='boss')banner(`명식 — ${EN[ids[0]].n}`);
}
function setIntent(e){const m=EN[e.id].m;e.move=m[e.mi%m.length];e.mi++}
function log(t){S.c.log.push(t);if(S.c.log.length>4)S.c.log.shift()}
function startTurn(){
  const c=S.c;c.turn++;c.block=0;c.switched=0;
  c.energy=3+(has('levia')?1:0)+c.nextE;c.nextE=0;
  if(c.bond)heal(c.active,c.bond);
  if(has('turtle'))gainBlock(4);
  if(has('hoar')&&c.turn===1)c.block=10;
  if(c.field.t>0){gainBlock(c.field.b);heal(c.active,2);c.field.t--}
  if(c.orbit){gainBlock(c.orbit);gainConc(c.active,1)}

function draw(n){
  const c=S.c;
  for(let i=0;i<n;i++){
    if(!c.draw.length){if(!c.discard.length)break;c.draw=shuffle(c.discard);c.discard=[]}
    if(c.hand.length>=10)break;
    c.hand.push(c.draw.pop());
  }
}
function costOf(card){
  const d=CD[card.id];let k=Array.isArray(d.c)?d.c[card.up?1:0]:d.c;
  if(d.o!=='any'&&d.o!==S.c.active)k+=1;
  if(card.id==='aem_break'&&S.c.mecha)k-=1;
  return Math.max(0,k);
}
function canPlay(card){
  const d=CD[card.id];if(d.unplay||S.c.busy)return false;
  if(d.o!=='any'&&S.party[d.o].down)return false;
  return costOf(card)<=S.c.energy;
}
function clickCard(uid){
  const c=S.c;const card=c.hand.find(x=>x.uid===uid);if(!card||!canPlay(card))return;
  if(c.tgt&&c.tgt.uid===uid){c.tgt=null;return render()}
  if(CD[card.id].tg&&alive().length>1){c.tgt={kind:'card',uid};return render()}
  flyCard(uid,CD[card.id].tg?alive()[0]:null);playCard(uid,alive()[0]);
}
function clickEnemy(euid){
  const c=S.c;if(!c.tgt)return;const T=c.enemies.find(e=>e.uid===euid);if(!T||T.dead)return;
  const t=c.tgt;c.tgt=null;
  if(t.kind==='card'){flyCard(t.uid,T);playCard(t.uid,T)}else doLib(T);
}
function playCard(uid,T){
  const c=S.c;const idx=c.hand.findIndex(x=>x.uid===uid);const card=c.hand[idx];const d=CD[card.id];
  c.energy-=costOf(card);c.hand.splice(idx,1);

  const atk=d.t==='공격';anim('u-'+owner,atk?'atk':'cast');FXDELAY=atk?170:60;
  if(atk&&c.calc){c.calcNow=c.calc;c.calc=0}

  if(atk&&c.freeBrush&&S.team.includes('lyn'))paint(c.freeBrush);
  gainConc(owner,1);gainLib(owner,1);
  if(d.pw){}else if(d.ex)c.exhaust.push(card);else c.discard.push(card);

}
function afterAction(){
  maybeWin();render();
}
function maybeWin(){
  const c=S.c;if(!c||alive().length||c.ending)return false;
  c.ending=true;c.busy=true;c.tgt=null;window.FAST?queueMicrotask(winCombat):setTimeout(winCombat,750);return true;
}
function gainConc(id,n){S.c.conc[id]=Math.min(3,S.c.conc[id]+n)}
function gainLib(id,n){S.c.lib[id]=Math.min(5,S.c.lib[id]+n)}
function hit(T,base,o={}){
  if(!T||T.dead)return;const c=S.c;let d=base;
  if(!o.raw)d+=(c.cur==='aem'&&c.mecha?3:0)+(has('fdread')?1:0)+(has('dreamless')?2:0)+((c.cur==='aem'||c.cur==='mor')&&has('snip')?2:0)+(c.cur==='cam'?c.bloom:0)+(c.cur==='lyn'?Math.floor(c.paint/2):0)+c.calcNow;
  d+=T.ur||0;
  let m=1;if(c.amp>0)m*=1.3;if(c.weak>0)m*=.75;if(T.vuln>0)m*=1.5;

function dmgEnemy(T,d,pierce){
  let left=d;if(!pierce){const ab=Math.min(T.block,left);T.block-=ab;left-=ab}
  T.hp-=left;pop(T,`-${d}`,'dmg');anim('e'+T.uid,'hit',FXDELAY);
  if(T.hp<=0){T.hp=0;T.dead=true;S.stats.kills++;log(`${EN[T.id].n} 처치!`);if(has('chirp'))heal(S.c.active,3);if(has('hecate'))S.c.energy++}
}
const fz=(T,n)=>{if(T&&!T.dead){T.fz+=n;pop(T,`잔향 +${n}`,'info')}};
const vuln=(T,n)=>{if(T&&!T.dead)T.vuln+=n+(has('explorer')?1:0)};
function gainBlock(n){const c=S.c;c.block+=n;pop('party',`+${n} 보호막`,'blk');if(c.hyp&&n>0&&alive().length)dmgEnemy(pick(alive()),c.hyp)}
function paint(n){const c=S.c;c.paint=Math.min(12,c.paint+n);if(n>0)pop('p-lyn',`색채 +${n}`,'info')}
function bloom(n){const c=S.c;c.bloom=Math.min(10,c.bloom+n);if(n>0)pop('p-cam',`개화 +${n}`,'info')}
function unravel(T,n){if(T&&!T.dead){T.ur+=n;pop(T,`해체 +${n}`,'info')}}
function selfHurt(id,n){const p=S.party[id];if(!p||p.down)return;const lost=Math.min(n,p.hp-1);if(lost<=0)return;p.hp-=lost;pop('p-'+id,`-${lost}`,'dmg');if(id==='cam'&&S.c.camUni)bloom(S.c.camUni)}
function heal(id,n){const p=S.party[id];if(p.down)return;const before=p.hp;p.hp=Math.min(p.maxHp,p.hp+n);if(S.c&&S.screen==='combat'&&p.hp>before)pop('p-'+id,`+${p.hp-before}`,'heal')}
function setField(n,b){const f=S.c.field;f.t=Math.max(f.t,n);f.b=Math.max(f.b,b);pop('party','별의 영역','info')}
function toggleMecha(b){const c=S.c;if(c.mecha){c.mecha=false;gainBlock(b);pop('p-aem','일반 형태','info')}else{c.mecha=true;pop('p-aem','메카스카우트!','info')}}

/* 교체 · 변주 · 협주 */
function switchCost(){return S.c.switched?1:0}
function doSwitch(id){
  const c=S.c;if(c.busy||id===c.active||S.party[id].down)return;
  const cost=switchCost();if(c.energy<cost)return;
  c.energy-=cost;const out=c.active;const full=c.conc[out]>=3;
  if(full){c.cur=out;outro(out,id);c.conc[out]=0}
  c.active=id;c.cur=id;
  if(!c.switched){if(has('vjun'))gainBlock(5);if(has('zig'))draw(1)}
  c.switched++;
  anim('u-'+id,'cast');
  if(full){FXDELAY=200;intro(id);FXDELAY=0;log(`협주 → 변주! ${CH[out].name} → ${CH[id].name}`);banner(`${CH[out].name} 협주 → ${CH[id].name} 변주`)}
  else log(`${CH[id].name}(으)로 교체`);
  if(c.ghost&&alive().length){c.cur='aem';hit(pick(alive()),c.ghost)}
  afterAction();
}
function outro(id,inc){
  const c=S.c;

  if(id==='aem')c.amp=Math.max(c.amp,2);
  if(id==='sk'){heal(inc,6);c.amp=Math.max(c.amp,1)}
  if(id==='lyn'){c.energy+=1;draw(1)}
  if(id==='mor'){gainBlock(4);c.amp=Math.max(c.amp,1)}
  if(id==='chi'){alive().forEach(e=>unravel(e,2));heal(inc,4)}
  if(id==='cam'){alive().forEach(e=>{e.weak+=1});c.amp=Math.max(c.amp,1)}
}
function intro(id){

  if(id==='aem'){hit(pick(alive()),8);c.amp=Math.max(c.amp,1)}
  if(id==='sk')gainBlock(8);
  if(id==='lyn'){paint(2);const T=pick(alive());hit(T,4);hit(T,4)}
  if(id==='mor')gainBlock(6);
  if(id==='chi'){const T=pick(alive());hit(T,6);unravel(T,2)}
  if(id==='cam')hit(pick(alive()),9);
}
const LIB_TG={rov:1,aem:1,mor:1,cam:1};
function clickLib(){
  const c=S.c;const id=c.active;if(c.busy||c.lib[id]<5)return;
  if(LIB_TG[id]&&alive().length>1){c.tgt={kind:'lib'};return render()}

function doLib(T){

  anim('u-'+id,id==='sk'?'cast':'ult');FXDELAY=id==='sk'?100:380;

  if(id==='lyn'){const k=c.paint;c.paint=0;alive().forEach(e=>hit(e,8+k*3))}
  if(id==='mor'){gainBlock(15);hit(T,c.block,{raw:1})}
  if(id==='chi'){alive().forEach(e=>{hit(e,10);unravel(e,3)});T_().forEach(x=>heal(x,5))}

/* 적 턴 */
async function endTurn(){
  const c=S.c;if(c.busy)return;c.busy=true;c.tgt=null;
  c.discard.push(...c.hand.filter(x=>!CD[x.id].ex||true));c.hand=[];
  c.amp=Math.max(0,c.amp-1);c.weak=Math.max(0,c.weak-1);
  if(has('mephis')&&c.block===0)gainBlock(6);
  render();await sleep(350);
  for(const e of c.enemies){
    if(e.dead)continue;
    e.block=0;
    if(e.fz>0){dmgEnemy(e,e.fz,true);log(`회절 잔향 폭발 ${e.fz}`);e.fz=Math.max(0,e.fz-1);render();await sleep(300);if(e.dead){if(maybeWin()){render();return}continue}}
    const m=e.move;
    if(m.b){e.block+=m.b;pop(e,`+${m.b} 방어`,'blk')}
    if(m.s){e.str+=m.s;pop(e,`힘 +${m.s}`,'info')}
    if(m.w){c.weak+=m.w;pop('party',`약화 ${m.w}`,'info')}
    log(`${EN[e.id].n} — ${m.n}`);
    if(m.d){anim('e'+e.uid,'atk');render();await sleep(190);
      for(let h=0;h<(m.h||1);h++){if(h)anim('e'+e.uid,'jab');hurtParty(enemyDmg(e,m));render();await sleep(h<(m.h||1)-1?200:330);if(wiped()){render();await sleep(700);return lose()}}}
    else{anim('e'+e.uid,'cast');render();await sleep(380)}

function hurtParty(d){

function winCombat(){
  const c=S.c;const kind=c.kind;
  let gold=kind==='boss'?rnd(90,110):kind==='elite'?rnd(32,42):rnd(14,22);if(has('charm'))gold=Math.round(gold*1.5);
  S.gold+=gold;
  const rw={gold,cards:rollCards(3,kind!=='battle'),echo:null};
  if(kind==='elite'||kind==='boss'){const ids=c.enemies.map(e=>e.id).filter(id=>ECHO[id]&&!has(id));rw.echo=ids.length?ids[0]:pick(TREASURE_ECHO.filter(e=>!has(e)))||null}
  else if(Math.random()<.22){const ids=c.enemies.map(e=>e.id).filter(id=>ECHO[id]&&!has(id));if(ids.length)rw.echo=pick(ids)}
  if(rw.echo)gainEcho(rw.echo);
  S.reward=rw;S.screen='reward';S.c=null;
  render();
}
function rollCards(n,better){
  const out=[];const pool=REWARD_POOL.filter(k=>S.team.includes(CD[k].o));
  while(out.length<n&&pool.length){
    let id=pick(pool);if(CD[id].r&&Math.random()>(better?.55:.3))continue;
    pool.splice(pool.indexOf(id),1);out.push(mk(id,Math.random()<(better?.25:.08)));
  }
  return out;
}

/* ============ 아트 ============
 우선순위: assets/<id>_idle.png(가로 스프라이트 시트) → assets/<id>.png(초상) → 위키 프로필 → 기본 실루엣
 적은 파일명 앞에 enemy_ 를 붙입니다. 예) assets/enemy_levia_idle.png */
const WIKI='https://static.wikia.nocookie.net/wutheringwaves/images/';
const WEB_ART={lyn:WIKI+'3/34/Resonator_Lynae.png/revision/latest',mor:WIKI+'2/25/Resonator_Mornye.png/revision/latest',chi:WIKI+'d/d7/Resonator_Chisa.png/revision/latest',cam:WIKI+'9/9f/Resonator_Camellya.png/revision/latest',rov:WIKI+'4/47/Resonator_Rover.png/revision/latest',aem:WIKI+'e/e8/Resonator_Aemeath.png/revision/latest',sk:WIKI+'d/da/Resonator_Shorekeeper.png/revision/latest'};
const ARTS={};
function loadImg(src){return new Promise(r=>{const i=new Image();i.referrerPolicy='no-referrer';const t=setTimeout(()=>r(null),6000);
  i.onload=()=>{clearTimeout(t);r(i)};i.onerror=()=>{clearTimeout(t);r(null)};i.src=src})}
const stripOf=i=>i?{src:i.src,frames:Math.max(1,Math.round(i.naturalWidth/i.naturalHeight))}:null;
async function loadArt(){
  await Promise.all([...ALL,...Object.keys(EN)].map(async id=>{
    const pre=CH[id]?'':'enemy_';
    const [idle,atk,local]=await Promise.all([loadImg(`assets/${pre}${id}_idle.png`),loadImg(`assets/${pre}${id}_attack.png`),loadImg(`assets/${pre}${id}.png`)]);
    let portrait=local?local.src:null;
    const web=WEB_ART[id]||(ENEMY_ART[id]&&WIKI+ENEMY_ART[id]+'/revision/latest');
    if(!portrait&&web){const w=await loadImg(web);if(w)portrait=w.src}
    ARTS[id]={idle:stripOf(idle),attack:stripOf(atk),portrait};
  }));
}
function spriteImg(s,once){
  const n=s.frames;
  return `<img src="${s.src}" style="width:${n*100}%;${n>1?`animation-duration:${(n/8).toFixed(2)}s;animation-timing-function:steps(${n});${once?'animation-iteration-count:1;':''}`:'animation:none;'}">`;
}
function partySVG(id){
  const c=CH[id].color;
  return `<svg class="ph" viewBox="0 0 100 125"><defs><linearGradient id="pg-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".2"/></linearGradient></defs>
    <circle cx="50" cy="26" r="17" fill="url(#pg-${id})"/><path d="M20 124 L28 62 Q50 44 72 62 L80 124Z" fill="url(#pg-${id})"/>
    <text x="50" y="98" text-anchor="middle" font-size="24" font-weight="900" fill="#111">${CH[id].ini}</text></svg>`;
}
function enemySVG(id,uid){
  const d=EN[id];const c=EL[d.el];const k=d.boss?14:d.elite?11:8;let pts='';
  for(let i=0;i<k*2;i++){const a=Math.PI*i/k-Math.PI/2;const r=i%2?30:(d.boss?46:42);pts+=`${50+Math.cos(a)*r},${54+Math.sin(a)*r} `}
  return `<svg class="ph" viewBox="0 0 100 104"><defs><radialGradient id="eg${uid}"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".3" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient></defs>
    <circle cx="50" cy="54" r="48" fill="url(#eg${uid})" opacity=".45"/>
    <polygon points="${pts}" fill="#0b0f1d" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="50" cy="54" r="22" fill="none" stroke="${c}" stroke-opacity=".4"/>
    <text x="50" y="64" text-anchor="middle" font-size="${d.boss?30:26}" fill="${c}">${d.sym}</text></svg>`;
}
function figHTML(id,uid){
  const a=ARTS[id]||{};
  if(a.idle)return `<div class="sprite">${spriteImg(a.idle)}</div>`;
  if(a.portrait&&uid)return `<div class="eimg"><img src="${a.portrait}" referrerpolicy="no-referrer" alt=""></div>`;
  if(a.portrait)return `<div class="stand"><img src="${a.portrait}" referrerpolicy="no-referrer" alt=""><i></i></div>`;
  return uid?enemySVG(id,uid):partySVG(id);
}
function artStyle(owner){
  const a=ARTS[owner]||{};
  if(a.portrait)return `background-image:url('${a.portrait}');background-size:120%;background-position:50% 18%`;
  if(a.idle)return `background-image:url('${a.idle.src}');background-size:${a.idle.frames*100*1.0}% auto;background-position:0 20%;image-rendering:pixelated`;
  return '';
}

/* ============ 연출 ============ */
const $=s=>document.querySelector(s);
let FXQ=[],AQ=[],FXDELAY=0;
function pop(target,text,cls){FXQ.push({target:typeof target==='string'?target:'e'+target.uid,text,cls,delay:FXDELAY})}
function anim(key,cls,delay){AQ.push({key,cls,delay:delay??0})}
function shakeQ(){}
const ACLS=['atk','jab','hit','cast','ult','block'];
function bodyOf(key){return key.startsWith('u-')?document.querySelector(`#${key} .body`):document.querySelector(`#e-${key.slice(1)} .body`)}
function flushFx(){
  const layer=$('#fx');const fq=FXQ;FXQ=[];const aq=AQ;AQ=[];
  const per={};
  fq.forEach(f=>{const k=per[f.target]=(per[f.target]||0)+1;setTimeout(()=>{
    let el=document.querySelector(`[data-fx="${f.target}"]`);
    if(!el&&S&&S.c)el=document.querySelector(`[data-fx="p-${S.c.active}"]`);
    if(!el)return;const r=el.getBoundingClientRect();const s=document.createElement('div');
    s.className='pop '+f.cls;s.textContent=f.text;
    s.style.left=(r.left+r.width/2+((k%3)-1)*22)+'px';s.style.top=(r.top+r.height*.28-(k>1?(k-1)*6:0))+'px';
    if(f.cls==='dmg'&&parseInt(f.text.slice(1))>=18){s.style.fontSize='30px';const st=$('#stage');if(st){st.classList.remove('shake');void st.offsetWidth;st.classList.add('shake')}}
    layer.appendChild(s);setTimeout(()=>s.remove(),950)},f.delay+(k-1)*90)});
  aq.forEach(a=>setTimeout(()=>{
    const el=bodyOf(a.key);if(!el)return;
    el.classList.remove(...ACLS);void el.offsetWidth;el.classList.add(a.cls);
    const done=e=>{if(e.target!==el)return;el.classList.remove(a.cls);el.removeEventListener('animationend',done)};
    el.addEventListener('animationend',done);
    // 공격 스프라이트가 있으면 한 번 재생
    const id=a.key.startsWith('u-')?a.key.slice(2):(S.c&&(S.c.enemies.find(e=>'e'+e.uid===a.key)||{}).id);
    const art=ARTS[id];const sp=el.querySelector('.sprite');
    if(sp&&art&&art.attack&&['atk','ult','jab'].includes(a.cls)){sp.innerHTML=spriteImg(art.attack,true);
      setTimeout(()=>{if(sp.isConnected)sp.innerHTML=spriteImg(art.idle)},art.attack.frames/8*1000)}
  },a.delay));
}
function banner(t){const b=document.createElement('div');b.className='banner';b.textContent=t;document.body.appendChild(b);setTimeout(()=>b.remove(),1150)}
function flyCard(uid,T){
  const el=document.querySelector(`[data-card="${uid}"]`);if(!el)return;
  const r=el.getBoundingClientRect();const cl=el.cloneNode(true);cl.classList.add('flycard');cl.removeAttribute('onclick');
  cl.style.left=r.left+'px';cl.style.top=r.top+'px';cl.style.width=r.width+'px';cl.style.height=r.height+'px';cl.style.transform='none';
  $('#fx').appendChild(cl);
  let tx=window.innerWidth/2,ty=window.innerHeight*.4;
  const tb=T?bodyOf('e'+T.uid):null;const st=$('#stage');
  if(tb){const b=tb.getBoundingClientRect();tx=b.left+b.width/2;ty=b.top+b.height/2}else if(st){const b=st.getBoundingClientRect();tx=b.left+b.width*.45;ty=b.top+b.height*.4}
  requestAnimationFrame(()=>{cl.style.transform=`translate(${tx-r.left-r.width/2}px,${ty-r.top-r.height/2}px) scale(.35) rotate(${T?12:-8}deg)`;cl.style.opacity='0'});
  setTimeout(()=>cl.remove(),360);
}

/* ============ 렌더 ============ */
const esc=s=>String(s);
const TYPESYM={공격:'⚔',스킬:'◈',파워:'✦',저주:'✕'};
function cardHTML(card,o={}){
  const d=CD[card.id];const col=d.o==='any'?'var(--any)':CH[d.o].color;
  const inCombat=o.combat;const cost=inCombat?costOf(card):(Array.isArray(d.c)?d.c[card.up?1:0]:d.c);
  const waiting=inCombat&&d.o!=='any'&&d.o!==S.c.active;
  const off=inCombat&&!canPlay(card);
  const sel=inCombat&&S.c.tgt&&S.c.tgt.uid===card.uid;
  const art=d.o==='any'?'':artStyle(d.o);
  return `<div class="card t-${d.t} ${off?'off':''} ${sel?'sel':''}" data-card="${card.uid}" style="--c:${col};${o.style||''}" ${o.click?`onclick="${o.click}"`:''} ${o.down?`onpointerdown="${o.down}"`:''}>
    ${d.unplay?'':`<div class="cost ${waiting?'up':''}">${cost}</div>`}
    ${waiting?'<div class="wait">대기 +1</div>':''}
    <div class="nm ${card.up?'u':''}">${d.n}${card.up?'+':''}</div>
    <div class="art" style="${art}">${art?'':`<div class="sym">${TYPESYM[d.t]}</div>`}</div>
    <div class="ty">${d.t}${d.r?' · 희귀':''}${d.ex?' · 소멸':''}</div>
    <div class="tx">${cardText(card)}</div>
    <div class="ow">${d.o==='any'?'공용':CH[d.o].name}${inCombat&&d.o!=='any'&&S.party[d.o].down?' (기절)':''}</div>
  </div>`;
}
function topBar(){

    <b>${ACTS[S.act].name}</b><span class="chip">층 ${S.floor}</span>
    ${T_().map(id=>{const p=S.party[id];return `<span class="chip"><span class="dot" style="background:${CH[id].color}"></span>${CH[id].name} ${p.down?'<span style="color:var(--red)">기절</span>':`${p.hp}/${p.maxHp}`}</span>`}).join('')}
    <span class="chip" style="color:var(--gold)">◎ ${S.gold}</span>

function render(){
  const app=$('#app');
  if(!$('#screen'))app.innerHTML='<div id="topbar"></div><div id="screen"></div><div id="modal"></div>';
  $('#topbar').innerHTML=S?topBar():'';
  const scr=$('#screen');
  if(!S)scr.innerHTML=MENU==='select'?selectHTML():MENU==='help'?helpHTML():titleHTML();
  else if(S.screen==='combat'){const cur=scr.querySelector('.combat');if(!cur||cur.dataset.cid!=S.c.id)scr.innerHTML=buildCombat();updateCombat()}
  else scr.innerHTML={map:mapHTML,recruit:recruitHTML,reward:rewardHTML,event:eventHTML,rest:restHTML,shop:shopHTML,msg:msgHTML,over:overHTML,win:winHTML}[S.screen]();
  $('#modal').innerHTML=S&&S.modal?modalHTML():'';
  if(S&&S.screen==='map')saveRun();
  if(S&&S.screen==='map'){const cur=document.querySelector('.node.avail');if(cur&&!S._scrolled){cur.scrollIntoView({block:'center'});S._scrolled=true}}
  requestAnimationFrame(flushFx);
}

/* ============ 타이틀 · 저장 ============ */
let MENU='title';
const SAVE_KEY='wuwa-spire-save-v1';
function saveRun(){try{const o={...S,c:null,ev:null,modal:null,reward:null,shop:null,screen:'map'};localStorage.setItem(SAVE_KEY,JSON.stringify(o))}catch(e){}}
function loadSave(){try{const t=localStorage.getItem(SAVE_KEY);return t?JSON.parse(t):null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function continueRun(){const o=loadSave();if(!o)return;S=o;S.screen='map';S._scrolled=false;UID=Math.max(UID,...S.deck.map(c=>c.uid))+1;render()}
function goMenu(m){S=null;MENU=m;render();window.scrollTo(0,0)}
function toTitle(){
  if(S&&S.screen!=='map'&&!confirm('지금 화면의 진행(전투·사건 등)은 저장되지 않아요. 마지막으로 저장된 지도 위치에서 이어할 수 있어요. 타이틀로 갈까요?'))return;

}

function openRecruit(){
  const pool=shuffle(ALL.filter(id=>!S.team.includes(id))).slice(0,3);
  S.modal=null;
  if(S.team.length>=3||!pool.length){S.reward={gold:0,cards:rollCards(3,true),echo:null,title:'동료들의 응원'};S.screen='reward';return render()}
  S.recruitOpts=pool;S.screen='recruit';render();
}
function recruit(id){
  if(S.team.includes(id)||S.team.length>=3)return;
  S.team.push(id);S.party[id]={hp:CH[id].maxHp,maxHp:CH[id].maxHp,down:false};
  ['_a','_b','_s'].forEach(x=>S.deck.push(mk(id+x)));
  const art=ARTS[id]&&(ARTS[id].portrait||ARTS[id].idle);
  S.screen='msg';S.msg={title:`${CH[id].name} 합류!`,body:`<div class="av" style="width:96px;height:96px;border-radius:18px;margin:6px auto 10px;background:${CH[id].color};${artStyle(id)}">${art?'':CH[id].ini}</div>

  render();
}

        const hr=$('#hand').getBoundingClientRect();
        D.clone.style.left=(hr.left+hr.width/2-D.r.width/2)+'px';D.clone.style.top=(hr.top-D.r.height*.45)+'px';D.clone.style.transform='scale(1.1)'}

function dragUp(ev){

}
function flyClone(cl,T){
  if(!cl)return;cl.classList.add('back');
  const r=cl.getBoundingClientRect();let tx=innerWidth/2,ty=innerHeight*.4;
  const tb=T?bodyOf('e'+T.uid):null;const st=$('#stage');
  if(tb){const b=tb.getBoundingClientRect();tx=b.left+b.width/2;ty=b.top+b.height/2}else if(st){const b=st.getBoundingClientRect();tx=b.left+b.width*.45;ty=b.top+b.height*.4}
  requestAnimationFrame(()=>{cl.style.transition='transform .3s cubic-bezier(.4,0,.6,1),opacity .3s';
    cl.style.transform=`translate(${tx-r.left-r.width/2}px,${ty-r.top-r.height/2}px) scale(.35) rotate(${T?12:-8}deg)`;cl.style.opacity='0'});
  setTimeout(()=>cl.remove(),340);
}
function libDown(ev){
  ev.stopPropagation();const c=S.c;if(!c||c.busy)return;
  if(!LIB_TG[c.active]){clickLib();return}
  dragStart(ev,'lib');
}
addEventListener('resize',()=>{if(S&&S.screen==='combat'&&$('#hand')&&!DRAG)renderHand()});
function rewardHTML(){
  const r=S.reward;
  return `<div class="screen"><div class="box" style="text-align:center"><h2>${r.title||'전투 승리'}</h2>
    <p>조개 화폐 <b style="color:var(--gold)">+${r.gold}</b></p>
    ${r.echo?`<div class="echoicon">${ECHO[r.echo].i}</div><p><b>에코 흡수: ${ECHO[r.echo].n}</b><br><span class="dim">${ECHO[r.echo].tx}</span></p>`:''}
    ${r.cards.length?`<p class="dim">카드를 1장 골라 덱에 추가하세요</p><div class="cards">${r.cards.map(c=>cardHTML(c,{click:`takeReward(${c.uid})`})).join('')}</div>`:''}
    <div style="margin-top:16px"><button class="btn" onclick="S.reward.cards=[];afterReward()">${r.cards.length?'건너뛰기':'계속'}</button></div></div></div>`;
}
function eventHTML(){
  const e=S.ev;
  return `<div class="screen"><div class="box"><div style="font-size:40px;text-align:center">${e.s}</div><h2 style="text-align:center">${e.t}</h2>
    <p>${e.b}</p>
    ${S.evResult?`<p style="color:var(--gold)">${S.evResult}</p><button class="btn primary" onclick="S.screen='map';render()">계속</button>`
    :`<div class="choices">${e.c.map((ch,i)=>`<button class="choice" ${ch.ok&&!ch.ok()?'disabled':''} onclick="evChoose(${i})"><b>${ch.l}</b>${ch.d?`<small>${ch.d}</small>`:''}</button>`).join('')}</div>`}
  </div></div>`;
}
function restHTML(){
  const RL=REST_LINES.filter(l=>S.team.includes(l[0]));const [who,line]=RL.length?RL[S.floor%RL.length]:['rov','모닥불이 조용히 타오른다.'];
  return `<div class="screen"><div class="box" style="text-align:center"><div style="font-size:40px">☾</div><h2>휴식처</h2>
    <p><span style="color:${CH[who].color}">${CH[who].name}</span> — ${line}</p>
    ${S.restDone?`<p style="color:var(--gold)">${S.restDone}</p><button class="btn primary" onclick="S.screen='map';render()">계속</button>`
    :`<div class="choices"><button class="choice" onclick="restHeal()"><b>휴식</b><small>모든 공명자 최대 체력 30% 회복 (기절한 공명자도 일으킴)</small></button>
      <button class="choice" onclick="restUp()" ${S.deck.some(x=>!x.up&&!CD[x.id].unplay)?'':'disabled'}><b>공명 조율</b><small>카드 1장 강화</small></button></div>`}
  </div></div>`;
}
function shopHTML(){
  const s=S.shop;
  return `<div class="screen"><div class="box" style="max-width:960px"><h2 style="text-align:center">탑 속의 상점</h2>
    <p class="dim" style="text-align:center">"조개 화폐만 있으면 뭐든지! 잔상 빼고요."</p>
    <div class="cards">${s.cards.map((it,i)=>`<div class="shopitem" style="${it.sold?'opacity:.25':''}">${cardHTML(it.c,{click:it.sold?'':`buyCard(${i})`})}<span class="price">◎ ${it.price}</span></div>`).join('')}</div>
    <div class="cards" style="margin-top:16px">
      ${s.ech.map((it,i)=>`<button class="choice" style="width:220px;${it.sold?'opacity:.25':''}" onclick="buyEcho(${i})" ${it.sold||S.gold<it.price?'disabled':''}><div class="echoicon">${ECHO[it.e].i}</div><b>${ECHO[it.e].n}</b><small>${ECHO[it.e].tx}</small><span class="price">◎ ${it.price}</span></button>`).join('')}
      <button class="choice" style="width:220px" onclick="buyRemove()" ${s.removed||S.gold<75?'disabled':''}><b>카드 제거</b><small>덱에서 카드 1장 제거</small><span class="price">◎ 75</span></button>
      <button class="choice" style="width:220px" onclick="buyKit()" ${s.kit||S.gold<40?'disabled':''}><b>응급 키트</b><small>모든 공명자 체력 15 회복</small><span class="price">◎ 40</span></button>
    </div>
    <div style="text-align:center;margin-top:16px"><button class="btn primary" onclick="S.screen='map';render()">떠나기</button></div></div></div>`;
}
function msgHTML(){return `<div class="screen"><div class="box" style="text-align:center"><h2>${S.msg.title}</h2><p>${S.msg.body}</p><button class="btn primary" onclick="S.screen='map';render()">계속</button></div></div>`}
function overHTML(){return `<div class="screen"><div class="box" style="text-align:center"><h2 style="color:var(--red)">모든 공명자가 쓰러졌습니다</h2>
  <p>${ACTS[S.act].name} · 층 ${S.floor} · 처치한 잔상 ${S.stats.kills}</p><p class="dim">잔향은 사라지지 않습니다. 다시 탑에 오르세요.</p>
  <button class="btn gold" onclick="goMenu('select')">다시 도전</button> <button class="btn" onclick="goMenu('title')">타이틀</button></div></div>`}
function winHTML(){return `<div class="screen"><div class="box" style="text-align:center"><div style="font-size:46px">✹</div><h2 style="color:var(--gold)">첨탑 정복!</h2>
  <p>알레프-원의 창조물이 무너지고, 탑 꼭대기에 고요한 별빛이 내려앉습니다.</p>
  <p>층 ${S.floor} · 처치한 잔상 ${S.stats.kills} · 에코 ${S.echoes.length}개 · 덱 ${S.deck.length}장</p>
  <button class="btn gold" onclick="goMenu('select')">다시 오르기</button> <button class="btn" onclick="goMenu('title')">타이틀</button></div></div>`}
function modalHTML(){
  const m=S.modal;
  if(m.kind==='deck'){
    const sorted=[...S.deck].sort((a,b)=>ALL.indexOf(CD[a.id].o)-ALL.indexOf(CD[b.id].o));
    return `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box"><h2>덱 (${S.deck.length}장)</h2>
      <div class="cards" style="margin-top:14px">${sorted.map(c=>cardHTML(c)).join('')}</div>
      <div style="text-align:center;margin-top:16px"><button class="btn" onclick="closeModal()">닫기</button></div></div></div>`;
  }
  if(m.kind==='pile')return `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box"><h2>${m.title}</h2>
      <div class="cards" style="margin-top:14px">${m.list.map(c=>cardHTML(c)).join('')||'<p class="dim">비어 있음</p>'}</div>
      <div style="text-align:center;margin-top:16px"><button class="btn" onclick="closeModal()">닫기</button></div></div></div>`;
  return `<div class="modal"><div class="box"><h2>${m.title}</h2>
    <div class="cards" style="margin-top:14px">${m.list.map(c=>cardHTML(c,{click:`modalPick(${c.uid})`})).join('')}</div>
    <div style="text-align:center;margin-top:16px"><button class="btn" onclick="closeModal()">취소</button></div></div></div>`;
}
render();loadArt().then(render);
</script>
